<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>St. Patrick's Peek-a-Boo Leprechaun Demo — Brian's Theater</title>
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #020d08;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    #stageContainer {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: url('images/stpatricks_stream_background.jpg') center center / cover no-repeat;
    }
    #effectCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    .demo-pill {
      background: rgba(6, 30, 20, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(52, 211, 153, 0.4);
      transition: all 0.25s ease;
    }
    .demo-pill.active {
      background: linear-gradient(135deg, #059669 0%, #10b981 100%);
      border-color: #a7f3d0;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.6);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div id="stageContainer">
    <!-- Top Interactive Control Studio -->
    <header class="absolute top-4 left-1/2 -translate-x-1/2 z-30 flex flex-col items-center gap-2.5 max-w-4xl w-full px-4">
      <div class="px-5 py-1.5 rounded-full bg-slate-950/85 backdrop-blur-md border border-emerald-500/50 shadow-xl flex items-center gap-2">
        <span class="text-emerald-400 text-base">🍀</span>
        <span class="text-xs uppercase tracking-widest font-black text-emerald-200">St. Patrick's 3D Pixar Leprechaun Studio</span>
      </div>

      <!-- Controls: Manual Peek Trigger & Hiding Spot Selection -->
      <div class="flex flex-wrap items-center justify-center gap-2 p-1.5 rounded-2xl bg-black/80 backdrop-blur-md border border-emerald-500/40 shadow-2xl">
        <button id="btnTriggerPeek" onclick="triggerPeekNow()" class="demo-pill active px-4 py-1.5 rounded-xl text-xs sm:text-sm font-black flex items-center gap-1.5 cursor-pointer hover:brightness-110">
          <span>✨</span> <span>Trigger Peek-a-Boo Now!</span>
        </button>

        <span class="text-[11px] font-mono font-bold text-emerald-300 px-1 uppercase tracking-wider">Hiding Spot:</span>
        <button id="spotBtn-random" onclick="selectSpot('random')" class="demo-pill active px-3 py-1 rounded-xl text-xs font-bold cursor-pointer">🎲 Random</button>
        <button id="spotBtn-0" onclick="selectSpot(0)" class="demo-pill px-3 py-1 rounded-xl text-xs font-bold cursor-pointer">🍺 Left Ale Barrel</button>
        <button id="spotBtn-1" onclick="selectSpot(1)" class="demo-pill px-3 py-1 rounded-xl text-xs font-bold cursor-pointer">🪟 Upper Window</button>
        <button id="spotBtn-2" onclick="selectSpot(2)" class="demo-pill px-3 py-1 rounded-xl text-xs font-bold cursor-pointer">🍻 Right Beer Barrels</button>
      </div>
    </header>

    <!-- Center Mock Movie Card (Visualizing Stream Center Clearance) -->
    <div class="relative z-20 w-[420px] aspect-[16/9] rounded-2xl border-2 border-emerald-500/50 shadow-[0_0_40px_rgba(16,185,129,0.3)] overflow-hidden bg-slate-950 flex flex-col items-center justify-center p-6 text-center">
      <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-black/40"></div>
      <span class="relative z-10 text-xs font-mono font-bold tracking-widest text-emerald-400 uppercase">Brian's Celtic Tavern</span>
      <h1 class="relative z-10 text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-300 via-green-200 to-amber-300 drop-shadow mt-1">Moana</h1>
      <p class="relative z-10 text-xs text-slate-400 mt-2 font-mono">Tavern Doors Open In: 02d 05h 59m 41s</p>
    </div>

    <!-- Live Motion Canvas -->
    <canvas id="effectCanvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('effectCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 1. Leprechaun State & Mechanics
    const lepImg = new Image();
    lepImg.src = 'images/pixar_leprechaun_cutout.png';

    let selectedSpotMode = 'random'; // 'random' or index 0, 1, 2
    let leprechaun = {
      active: false,
      state: 'hidden', // 'rising', 'peeking', 'hiding'
      progress: 0,     // 0 to 1
      spotIndex: 0,
      scale: 1,
      coinFlipping: false,
      coinY: 0,
      coinRot: 0,
      wink: false
    };

    let lastAutoPeekTime = Date.now();
    let clovers = [];
    let goldSparks = [];
    let rainbows = [];

    // The 3 Tailored Celtic Tavern Hiding Spots
    function getSpots() {
      return [
        {
          id: 'left_barrel',
          name: 'Left Ale Barrel',
          x: canvas.width * 0.24,
          baseY: canvas.height * 0.68,
          peekOffset: -canvas.height * 0.175,
          scale: 0.38,
          angle: -0.02,
          flip: false
        },
        {
          id: 'upper_window',
          name: 'Upper Tavern Window',
          x: canvas.width * 0.612,
          baseY: canvas.height * 0.38,
          peekOffset: -canvas.height * 0.08,
          scale: 0.20,
          angle: 0.01,
          flip: false
        },
        {
          id: 'right_barrels',
          name: 'Right Beer Barrels',
          x: canvas.width * 0.805,
          baseY: canvas.height * 0.80,
          peekOffset: -canvas.height * 0.17,
          scale: 0.38,
          angle: 0.02,
          flip: true
        }
      ];
    }

    function triggerPeekNow() {
      leprechaun.state = 'hidden';
      startLeprechaunPeek();
    }

    function selectSpot(spot) {
      selectedSpotMode = spot;
      document.querySelectorAll('[id^="spotBtn-"]').forEach(b => b.classList.remove('active'));
      document.getElementById(`spotBtn-${spot}`).classList.add('active');
      triggerPeekNow();
    }

    function startLeprechaunPeek() {
      const spots = getSpots();
      let chosenIdx = 0;
      if (selectedSpotMode === 'random') {
        chosenIdx = Math.floor(Math.random() * spots.length);
      } else {
        chosenIdx = parseInt(selectedSpotMode, 10);
      }

      leprechaun.active = true;
      leprechaun.state = 'rising';
      leprechaun.progress = 0;
      leprechaun.spotIndex = chosenIdx;
      leprechaun.coinFlipping = false;
      leprechaun.wink = false;
      leprechaun.holdTimer = 0;
    }

    // 2. Ambient Floating 4-Leaf Clovers
    const CLOVER_COUNT = 30;
    function initClovers() {
      clovers = [];
      for (let i = 0; i < CLOVER_COUNT; i++) {
        clovers.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 12 + 10,
          speedY: -(Math.random() * 0.9 + 0.4),
          speedX: (Math.random() - 0.5) * 0.7,
          rot: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.03,
          alpha: Math.random() * 0.5 + 0.45
        });
      }
    }
    initClovers();

    // 3. Drawing the Photorealistic Leprechaun on Canvas
    function drawLeprechaun(c, x, y, scale, angle, wink, tipHat, flip) {
      if (!lepImg.complete || lepImg.naturalWidth === 0) return;
      c.save();
      c.translate(x, y);
      c.rotate(angle);
      c.scale(scale * (flip ? -1 : 1), scale);

      // Subtle tavern warm lantern ambient glow around character
      c.shadowColor = 'rgba(245, 158, 11, 0.45)';
      c.shadowBlur = 20;

      const iw = lepImg.naturalWidth;
      const ih = lepImg.naturalHeight;

      // Draw sprite anchored at bottom center of character's visible chest
      c.drawImage(lepImg, -iw / 2, -ih, iw, ih);

      c.restore();
    }

    // 4. Gold Coin Toss & Sparkles
    function spawnCoinBurst(x, y) {
      for (let i = 0; i < 22; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = Math.random() * 4 + 1.5;
        goldSparks.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd - 1,
          size: Math.random() * 3 + 2,
          alpha: 1,
          color: (i % 2 === 0) ? '#fbbf24' : '#34d399'
        });
      }
    }

    function drawCloverShape(c, x, y, size) {
      c.save();
      c.translate(x, y);
      const leafR = size * 0.45;
      c.fillStyle = '#10b981';
      c.shadowColor = '#059669';
      c.shadowBlur = 8;
      // 4 Petals
      c.beginPath(); c.arc(0, -leafR, leafR, 0, Math.PI*2); c.fill();
      c.beginPath(); c.arc(0, leafR, leafR, 0, Math.PI*2); c.fill();
      c.beginPath(); c.arc(-leafR, 0, leafR, 0, Math.PI*2); c.fill();
      c.beginPath(); c.arc(leafR, 0, leafR, 0, Math.PI*2); c.fill();
      // Stem
      c.strokeStyle = '#047857';
      c.lineWidth = 2.5;
      c.beginPath();
      c.moveTo(0, 0);
      c.quadraticCurveTo(leafR * 0.4, leafR * 1.5, leafR * 0.8, leafR * 2.2);
      c.stroke();
      c.restore();
    }

    // Main 60fps Loop
    function loop(now) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Draw Ambient Floating Clovers
      for (let i = 0; i < clovers.length; i++) {
        const cl = clovers[i];
        cl.y += cl.speedY;
        cl.x += cl.speedX;
        cl.rot += cl.rotSpeed;

        if (cl.y < -30) { cl.y = canvas.height + 30; cl.x = Math.random() * canvas.width; }
        if (cl.x < -30) cl.x = canvas.width + 30;
        if (cl.x > canvas.width + 30) cl.x = -30;

        ctx.save();
        ctx.globalAlpha = cl.alpha;
        ctx.translate(cl.x, cl.y);
        ctx.rotate(cl.rot);
        drawCloverShape(ctx, 0, 0, cl.size);
        ctx.restore();
      }

      // 2. Auto-Trigger Peek Every 14 Seconds if Idle
      if (!leprechaun.active && (now - lastAutoPeekTime > 14000)) {
        startLeprechaunPeek();
        lastAutoPeekTime = now;
      }

      // 3. Update & Draw Peek-a-Boo Leprechaun
      if (leprechaun.active) {
        const spots = getSpots();
        const curSpot = spots[leprechaun.spotIndex] || spots[0];

        let currentY = curSpot.baseY;
        let tipHat = false;

        if (leprechaun.state === 'rising') {
          leprechaun.progress += 0.038;
          // Easing
          const ease = Math.sin((leprechaun.progress * Math.PI) / 2);
          currentY = curSpot.baseY + curSpot.peekOffset * ease;

          if (leprechaun.progress >= 1) {
            leprechaun.state = 'peeking';
            leprechaun.progress = 0;
            leprechaun.holdTimer = now;
            leprechaun.coinFlipping = true;
            leprechaun.coinY = 0;
            spawnCoinBurst(curSpot.x, currentY - 60);
          }
        } else if (leprechaun.state === 'peeking') {
          const peekDuration = now - leprechaun.holdTimer;
          const bob = Math.sin(peekDuration * 0.004) * 3;
          currentY = curSpot.baseY + curSpot.peekOffset + bob;

          // Coin Flip Animation in Air!
          if (leprechaun.coinFlipping) {
            leprechaun.coinY = Math.sin((peekDuration / 2000) * Math.PI) * -65;
            leprechaun.coinRot += 0.22;
          }

          if (peekDuration > 2600) {
            leprechaun.state = 'hiding';
            leprechaun.progress = 0;
          }
        } else if (leprechaun.state === 'hiding') {
          leprechaun.progress += 0.045;
          const ease = Math.cos((leprechaun.progress * Math.PI) / 2);
          currentY = curSpot.baseY + curSpot.peekOffset * ease;

          if (leprechaun.progress >= 1) {
            leprechaun.active = false;
            leprechaun.state = 'hidden';
            lastAutoPeekTime = now;
          }
        }

        // Draw Leprechaun at calculated spot
        drawLeprechaun(ctx, curSpot.x, currentY, curSpot.scale, curSpot.angle, leprechaun.wink, tipHat, curSpot.flip);

        // Draw Spinning Celtic Gold Coin if flipping
        if (leprechaun.coinFlipping && leprechaun.state === 'peeking') {
          ctx.save();
          const spriteH = lepImg.naturalHeight * curSpot.scale;
          const coinX = curSpot.x + (curSpot.flip ? -45 : 45);
          const coinY = currentY - (spriteH * 0.55) + leprechaun.coinY;
          ctx.translate(coinX, coinY);
          ctx.scale(Math.cos(leprechaun.coinRot), 1);

          // Golden Coin
          ctx.fillStyle = '#fbbf24';
          ctx.shadowColor = '#f59e0b';
          ctx.shadowBlur = 14;
          ctx.beginPath();
          ctx.arc(0, 0, 11, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = '#fef08a';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          // Shamrock Stamped on Coin
          ctx.fillStyle = '#b45309';
          ctx.font = '10px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('☘', 0, 0);

          ctx.restore();
        }
      }

      // 4. Draw Coin Gold Sparkles
      for (let i = goldSparks.length - 1; i >= 0; i--) {
        const s = goldSparks[i];
        s.x += s.vx;
        s.y += s.vy;
        s.vy += 0.04;
        s.alpha -= 0.02;

        if (s.alpha <= 0) {
          goldSparks.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = s.alpha;
        ctx.fillStyle = s.color;
        ctx.shadowColor = s.color;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      requestAnimationFrame(loop);
    }

    // Auto-trigger on page load
    setTimeout(startLeprechaunPeek, 800);
    requestAnimationFrame(loop);
  </script>
</body>
</html>
