<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>St. Patrick's Peek-a-Boo Leprechaun Demo — Brian's Theater</title>
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #020d08;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    #stageContainer {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: url('images/stpatricks_stream_background.jpg') center center / cover no-repeat;
    }
    #effectCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    .demo-pill {
      background: rgba(6, 30, 20, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(52, 211, 153, 0.4);
      transition: all 0.25s ease;
    }
    .demo-pill.active {
      background: linear-gradient(135deg, #059669 0%, #10b981 100%);
      border-color: #a7f3d0;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.6);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div id="stageContainer">
    <!-- Top Interactive Control Studio -->
    <header class="absolute top-4 left-1/2 -translate-x-1/2 z-30 flex flex-col items-center gap-2 max-w-4xl w-full px-3">
      <div class="px-5 py-1.5 rounded-full bg-slate-950/85 backdrop-blur-md border border-emerald-500/50 shadow-xl flex items-center gap-2">
        <span class="text-emerald-400 text-base">🍀</span>
        <span class="text-xs uppercase tracking-widest font-black text-emerald-200">St. Patrick's Leprechaun Motion Studio</span>
      </div>

      <!-- Controls: Manual Peek Trigger, Hiding Spot & Mascot Skin Selection -->
      <div class="flex flex-wrap items-center justify-center gap-1.5 p-1.5 rounded-2xl bg-black/80 backdrop-blur-md border border-emerald-500/40 shadow-2xl">
        <button id="btnTriggerPeek" onclick="triggerPeekNow()" class="demo-pill active px-3 py-1.5 rounded-xl text-xs sm:text-sm font-black flex items-center gap-1 cursor-pointer hover:brightness-110">
          <span>✨</span> <span>Peek</span>
        </button>

        <button id="btnRainbowJumpScare" onclick="triggerRainbowJumpScareNow()" class="demo-pill px-3 py-1.5 rounded-xl text-xs sm:text-sm font-black flex items-center gap-1 cursor-pointer bg-gradient-to-r from-red-500/80 via-yellow-500/80 to-emerald-500/80 text-white hover:brightness-125 border border-amber-300/60 shadow-lg">
          <span>🌈</span> <span>Rainbow Jump-Scare!</span>
        </button>

        <button id="btnToggleSound" onclick="toggleDemoSound()" class="demo-pill px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-1 cursor-pointer bg-emerald-950/70 text-emerald-300 hover:brightness-125 border border-emerald-500/50">
          <span id="soundIcon">🔊</span> <span id="soundLabel">Sound: ON</span>
        </button>

        <button id="btnToggleMusic" onclick="toggleDemoMusic()" class="demo-pill px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-1 cursor-pointer bg-emerald-950/70 text-emerald-300 hover:brightness-125 border border-emerald-500/50">
          <span id="musicIcon">🎵</span> <span id="musicLabel">Music: ON</span>
        </button>

        <div class="flex items-center gap-1 bg-emerald-950/60 p-1 rounded-xl border border-emerald-500/30">
          <span class="text-[11px] font-mono font-bold text-amber-300 px-1 uppercase tracking-wider">Ambient:</span>
          <button id="bgmBtn-jig" onclick="selectDemoBgmTrack('jig')" class="demo-pill active px-2.5 py-1 rounded-xl text-xs font-bold cursor-pointer" title="Lively fiddle, guitar & tin whistle">🎻 Tavern Jig</button>
          <button id="bgmBtn-pub" onclick="selectDemoBgmTrack('pub')" class="demo-pill px-2.5 py-1 rounded-xl text-xs font-bold cursor-pointer" title="Dublin crowd chatter, clinking pints & hearth">🍺 Irish Pub</button>
          <button id="bgmBtn-harp" onclick="selectDemoBgmTrack('harp')" class="demo-pill px-2.5 py-1 rounded-xl text-xs font-bold cursor-pointer" title="Serene acoustic harp & woodland breeze">🪕 Celtic Harp</button>
          <button id="bgmBtn-reel" onclick="selectDemoBgmTrack('reel')" class="demo-pill px-2.5 py-1 rounded-xl text-xs font-bold cursor-pointer" title="Fast traditional tin whistle & bodhrán">🥁 Bodhrán Reel</button>
        </div>

        <div class="flex items-center gap-1 bg-emerald-950/60 p-1 rounded-xl border border-emerald-500/30">
          <button id="btnToggleDancer" onclick="toggleDemoDancer()" class="demo-pill active px-2.5 py-1 rounded-xl text-xs font-bold cursor-pointer bg-emerald-900/80 text-emerald-300 border border-emerald-400/50">
            <span id="dancerIcon">🕺</span> <span id="dancerLabel">Dancer: ON</span>
          </button>
          <span class="text-[11px] font-mono font-bold text-emerald-300 px-1 uppercase tracking-wider">Position:</span>
          <button id="dancerPosBtn-center" onclick="setDancerPosition('center')" class="demo-pill active px-2 py-1 rounded-xl text-xs font-bold cursor-pointer">Center</button>
          <button id="dancerPosBtn-right" onclick="setDancerPosition('right')" class="demo-pill px-2 py-1 rounded-xl text-xs font-bold cursor-pointer">Right</button>
          <button id="dancerPosBtn-left" onclick="setDancerPosition('left')" class="demo-pill px-2 py-1 rounded-xl text-xs font-bold cursor-pointer">Left</button>
        </div>

        <span class="text-[11px] font-mono font-bold text-emerald-300 px-1 uppercase tracking-wider">Spot:</span>
        <button id="spotBtn-random" onclick="selectSpot('random')" class="demo-pill active px-2.5 py-1 rounded-xl text-xs font-bold cursor-pointer">🎲 Random</button>
        <button id="spotBtn-0" onclick="selectSpot(0)" class="demo-pill px-2.5 py-1 rounded-xl text-xs font-bold cursor-pointer">🍺 Left</button>
        <button id="spotBtn-1" onclick="selectSpot(1)" class="demo-pill px-2.5 py-1 rounded-xl text-xs font-bold cursor-pointer">🪟 Window</button>
        <button id="spotBtn-2" onclick="selectSpot(2)" class="demo-pill px-2.5 py-1 rounded-xl text-xs font-bold cursor-pointer">🍻 Right</button>
        <button id="spotBtn-3" onclick="selectSpot(3)" class="demo-pill px-2.5 py-1 rounded-xl text-xs font-bold cursor-pointer">🎬 Card</button>
        <button id="spotBtn-4" onclick="selectSpot(4)" class="demo-pill px-2.5 py-1 rounded-xl text-xs font-bold cursor-pointer">📜 Sign</button>

        <span class="text-slate-600 hidden sm:inline">|</span>

        <span class="text-[11px] font-mono font-bold text-amber-300 px-1 uppercase tracking-wider">Peek Mascot:</span>
        <button id="skinBtn-pixar" onclick="selectSkin('pixar')" class="demo-pill active px-2.5 py-1 rounded-xl text-xs font-bold cursor-pointer">🎩 Friendly Pixar</button>
        <button id="skinBtn-creepy" onclick="selectSkin('creepy')" class="demo-pill px-2.5 py-1 rounded-xl text-xs font-bold cursor-pointer">🧟 1993 Horror (Preview)</button>
      </div>
    </header>

    <!-- Center Mock Movie Card (Visualizing Stream Center Clearance) -->
    <div class="relative z-20 w-[420px] aspect-[16/9] rounded-2xl border-2 border-emerald-500/50 shadow-[0_0_40px_rgba(16,185,129,0.3)] overflow-hidden bg-slate-950 flex flex-col items-center justify-center p-6 text-center">
      <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-black/40"></div>
      <span class="relative z-10 text-xs font-mono font-bold tracking-widest text-emerald-400 uppercase">Brian's Celtic Tavern</span>
      <h1 class="relative z-10 text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-300 via-green-200 to-amber-300 drop-shadow mt-1">Moana</h1>
      <p class="relative z-10 text-xs text-slate-400 mt-2 font-mono">Tavern Doors Open In: 02d 05h 59m 41s</p>
    </div>

    <!-- Live Motion Canvas -->
    <canvas id="effectCanvas"></canvas>
  </div>

  <script src="audio/leprechaun_voice_data.js"></script>
  <script>
    const canvas = document.getElementById('effectCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 1. Leprechaun Multi-Variant Roster & Mechanics
    const LEP_SKINS = {
      pixar: {
        id: 'pixar',
        name: '3D Pixar Mascot',
        src: 'images/pixar_leprechaun_cutout.png',
        glowColor: 'rgba(245, 158, 11, 0.45)',
        glowBlur: 20,
        coinFill: '#fbbf24',
        coinStroke: '#fef08a',
        coinShadow: '#f59e0b',
        coinStamp: '☘',
        coinStampColor: '#b45309',
        scaleMul: 1.0,
        sparkColors: ['#fbbf24', '#34d399', '#fef08a']
      },
      creepy: {
        id: 'creepy',
        name: '1993 Horror Creepy Leprechaun',
        src: 'images/creepy_leprechaun_cutout.png',
        glowColor: 'rgba(34, 197, 94, 0.65)',
        glowBlur: 28,
        coinFill: '#b45309',
        coinStroke: '#4ade80',
        coinShadow: '#15803d',
        coinStamp: '☠',
        coinStampColor: '#fef08a',
        scaleMul: 0.95,
        sparkColors: ['#22c55e', '#16a34a', '#fbbf24', '#ef4444']
      }
    };

    const lepImages = {};
    for (const [key, skin] of Object.entries(LEP_SKINS)) {
      const img = new Image();
      img.src = skin.src;
      lepImages[key] = img;
    }

    const potImg = new Image();
    potImg.src = 'images/pot_of_gold_cutout.png';

    // ==========================================
    // AMBIENT BACKGROUND SOUNDSCAPES
    // ==========================================
    const BGM_TRACKS = {
      jig: {
        id: 'jig',
        name: 'Tavern Jig',
        icon: '🎻',
        src: 'audio/celtic_tavern_jig.mp3',
        description: 'Lively fiddle, guitar & tin whistle'
      },
      pub: {
        id: 'pub',
        name: 'Irish Pub',
        icon: '🍺',
        src: 'audio/irish_pub_ambience.mp3',
        description: 'Dublin crowd chatter, clinking pints & hearth'
      },
      harp: {
        id: 'harp',
        name: 'Celtic Harp',
        icon: '🪕',
        src: 'audio/celtic_harp_forest.mp3',
        description: 'Serene acoustic harp & woodland breeze'
      },
      reel: {
        id: 'reel',
        name: 'Bodhrán Reel',
        icon: '🥁',
        src: 'audio/celtic_bodhran_reel.mp3',
        description: 'Fast traditional tin whistle & bodhrán'
      }
    };
    window.BGM_TRACKS = BGM_TRACKS;

    // ==========================================
    // PROCEDURAL WEB AUDIO SYNTHESIZER ENGINE
    // Zero dependencies, 0ms latency, pure Web Audio API
    // ==========================================
    class LeprechaunAudioEngine {
      constructor(options = {}) {
        this.enabled = options.enabled !== undefined ? options.enabled : true;
        this.volume = options.volume !== undefined ? options.volume : 0.75;
        this.bgmEnabled = options.bgmEnabled !== undefined ? options.bgmEnabled : true;
        this.bgmVolume = options.bgmVolume !== undefined ? options.bgmVolume : 0.40;
        this.currentTrackId = options.trackId || 'jig';
        this.bgmAudio = null;
        this.ctx = null;
      }

      initBgm() {
        if (typeof Audio === 'undefined') return;
        const track = BGM_TRACKS[this.currentTrackId] || BGM_TRACKS.jig;
        if (!this.bgmAudio) {
          this.bgmAudio = new Audio(track.src);
          this.bgmAudio.loop = true;
          this.bgmAudio.volume = this.bgmEnabled ? this.bgmVolume : 0;
        }
      }

      setBgmTrack(trackId) {
        if (!BGM_TRACKS[trackId]) return this.currentTrackId;
        this.currentTrackId = trackId;
        const track = BGM_TRACKS[trackId];
        const wasPlaying = this.bgmAudio && !this.bgmAudio.paused;

        if (this.bgmAudio) {
          this.bgmAudio.pause();
          this.bgmAudio.src = track.src;
          this.bgmAudio.load();
        } else {
          this.initBgm();
        }

        if (this.bgmAudio && this.bgmEnabled && (wasPlaying || this.bgmEnabled)) {
          this.bgmAudio.playbackRate = 1.0;
          this.bgmAudio.volume = this.bgmVolume;
          this.bgmAudio.play().catch(() => {});
        }
        return this.currentTrackId;
      }

      startBgm() {
        this.initBgm();
        if (!this.bgmAudio) return;
        if (this.bgmEnabled) {
          this.bgmAudio.volume = this.bgmVolume;
          this.bgmAudio.play().catch(() => {});
        }
      }

      pauseBgm() {
        if (this.bgmAudio) this.bgmAudio.pause();
      }

      toggleBgm() {
        this.bgmEnabled = !this.bgmEnabled;
        this.initBgm();
        if (this.bgmAudio) {
          if (this.bgmEnabled) {
            this.bgmAudio.volume = this.bgmVolume;
            this.bgmAudio.play().catch(() => {});
          } else {
            this.bgmAudio.pause();
          }
        }
        return this.bgmEnabled;
      }

      setBgmVolume(vol) {
        this.bgmVolume = Math.max(0, Math.min(1, vol));
        if (this.bgmAudio && this.bgmEnabled) {
          this.bgmAudio.volume = this.bgmVolume;
        }
      }

      // Vinyl Tape-Stop & Duck for Horror Jump-Scare
      warpAndDuckBgm() {
        if (!this.bgmAudio || !this.bgmEnabled) return;
        let step = 0;
        const interval = setInterval(() => {
          step++;
          if (step >= 8 || !this.bgmAudio) {
            clearInterval(interval);
            if (this.bgmAudio) {
              this.bgmAudio.volume = 0;
              this.bgmAudio.pause();
              this.bgmAudio.playbackRate = 1.0;
            }
          } else {
            this.bgmAudio.playbackRate = Math.max(0.3, 1.0 - (step * 0.09));
            this.bgmAudio.volume = Math.max(0, this.bgmVolume * (1 - step / 8));
          }
        }, 30);
      }

      // Smooth Tavern Jig Recovery after retreat
      restoreBgm() {
        if (!this.bgmAudio || !this.bgmEnabled) return;
        this.bgmAudio.playbackRate = 1.0;
        this.bgmAudio.volume = 0;
        this.bgmAudio.play().catch(() => {});
        let step = 0;
        const interval = setInterval(() => {
          step++;
          if (step >= 10 || !this.bgmAudio) {
            clearInterval(interval);
            if (this.bgmAudio && this.bgmEnabled) this.bgmAudio.volume = this.bgmVolume;
          } else {
            this.bgmAudio.volume = this.bgmVolume * (step / 10);
          }
        }, 60);
      }

      ensureContext() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            this.ctx = new AudioCtx();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
        return this.ctx;
      }

      setVolume(vol) {
        this.volume = Math.max(0, Math.min(1, vol));
      }

      toggleSound() {
        this.enabled = !this.enabled;
        if (this.enabled) this.ensureContext();
        return this.enabled;
      }

      // 1. Friendly Coin Flip Ting & Shimmer (Standard Pixar Peek)
      playCoinFlip() {
        if (!this.enabled) return;
        const ctx = this.ensureContext();
        if (!ctx) return;
        const now = ctx.currentTime;

        const osc1 = ctx.createOscillator();
        const osc2 = ctx.createOscillator();
        const gain = ctx.createGain();

        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(1760, now);
        osc1.frequency.exponentialRampToValueAtTime(3520, now + 0.12);

        osc2.type = 'triangle';
        osc2.frequency.setValueAtTime(2637, now);
        osc2.frequency.exponentialRampToValueAtTime(5274, now + 0.15);

        gain.gain.setValueAtTime(0.24 * this.volume, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.45);

        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(ctx.destination);

        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + 0.5);
        osc2.stop(now + 0.5);
      }

      // 2. Celestial Harp & Chime Glissando for Rainbow Arc
      playRainbowChime() {
        if (!this.enabled) return;
        const ctx = this.ensureContext();
        if (!ctx) return;
        const now = ctx.currentTime;

        const freqs = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 1318.51];
        freqs.forEach((f, idx) => {
          const noteTime = now + (idx * 0.13);
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, noteTime);

          gain.gain.setValueAtTime(0.0001, noteTime);
          gain.gain.linearRampToValueAtTime(0.18 * this.volume, noteTime + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.0001, noteTime + 0.55);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(noteTime);
          osc.stop(noteTime + 0.6);
        });
      }

      // 3. Heavy Iron Cauldron Thud & Brass Coin Clatter (Pot of Gold Landing)
      playPotOfGoldLand() {
        if (!this.enabled) return;
        const ctx = this.ensureContext();
        if (!ctx) return;
        const now = ctx.currentTime;

        const osc = ctx.createOscillator();
        const thudGain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(125, now);
        osc.frequency.exponentialRampToValueAtTime(32, now + 0.28);

        thudGain.gain.setValueAtTime(0.6 * this.volume, now);
        thudGain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

        osc.connect(thudGain);
        thudGain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.4);

        for (let i = 0; i < 4; i++) {
          const cTime = now + 0.04 + (i * 0.06);
          const cOsc = ctx.createOscillator();
          const cGain = ctx.createGain();

          cOsc.type = 'square';
          cOsc.frequency.setValueAtTime(2400 + (Math.random() * 800), cTime);

          cGain.gain.setValueAtTime(0.12 * this.volume, cTime);
          cGain.gain.exponentialRampToValueAtTime(0.0001, cTime + 0.08);

          cOsc.connect(cGain);
          cGain.connect(ctx.destination);
          cOsc.start(cTime);
          cOsc.stop(cTime + 0.1);
        }
      }

      // 4. Electric Voltage Zap & Sub-Bass Drop Rumble (Glitch Trap)
      playCrackleTrap() {
        if (!this.enabled) return;
        const ctx = this.ensureContext();
        if (!ctx) return;
        const now = ctx.currentTime;

        const subOsc = ctx.createOscillator();
        const subGain = ctx.createGain();
        subOsc.type = 'sawtooth';
        subOsc.frequency.setValueAtTime(80, now);
        subOsc.frequency.exponentialRampToValueAtTime(28, now + 0.9);

        subGain.gain.setValueAtTime(0.45 * this.volume, now);
        subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.95);

        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(140, now);

        subOsc.connect(filter);
        filter.connect(subGain);
        subGain.connect(ctx.destination);
        subOsc.start(now);
        subOsc.stop(now + 1.0);

        for (let i = 0; i < 6; i++) {
          const zTime = now + 0.05 + (i * 0.12);
          const zOsc = ctx.createOscillator();
          const zGain = ctx.createGain();

          zOsc.type = 'sawtooth';
          zOsc.frequency.setValueAtTime(450 + (Math.random() * 600), zTime);
          zOsc.frequency.linearRampToValueAtTime(120, zTime + 0.07);

          zGain.gain.setValueAtTime(0.16 * this.volume, zTime);
          zGain.gain.exponentialRampToValueAtTime(0.001, zTime + 0.07);

          zOsc.connect(zGain);
          zGain.connect(ctx.destination);
          zOsc.start(zTime);
          zOsc.stop(zTime + 0.08);
        }
      }

      // 5. Explosive Horror Stinger Crash & Wicked Goblin Cackle (1993 Jump-Scare)
      playHorrorJumpScare() {
        if (!this.enabled) return;
        const ctx = this.ensureContext();
        if (!ctx) return;
        const now = ctx.currentTime;

        const bufferSize = Math.floor(ctx.sampleRate * 0.6);
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.14));
        }
        const noiseNode = ctx.createBufferSource();
        noiseNode.buffer = buffer;

        const noiseFilter = ctx.createBiquadFilter();
        noiseFilter.type = 'bandpass';
        noiseFilter.frequency.setValueAtTime(1100, now);
        noiseFilter.Q.setValueAtTime(2, now);

        const noiseGain = ctx.createGain();
        noiseGain.gain.setValueAtTime(0.75 * this.volume, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

        noiseNode.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noiseGain.connect(ctx.destination);
        noiseNode.start(now);

        [440, 466, 880, 932].forEach((f, idx) => {
          const sOsc = ctx.createOscillator();
          const sGain = ctx.createGain();
          sOsc.type = 'sawtooth';
          sOsc.frequency.setValueAtTime(f, now);
          sOsc.frequency.exponentialRampToValueAtTime(f * 1.5, now + 0.35);

          sGain.gain.setValueAtTime((0.15 / (idx + 1)) * this.volume, now);
          sGain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);

          sOsc.connect(sGain);
          sGain.connect(ctx.destination);
          sOsc.start(now);
          sOsc.stop(now + 0.75);
        });

        // Wicked Goblin FM Tremolo Cackle
        const carrier = ctx.createOscillator();
        const modulator = ctx.createOscillator();
        const modGain = ctx.createGain();
        const cackleGain = ctx.createGain();

        carrier.type = 'triangle';
        carrier.frequency.setValueAtTime(620, now + 0.1);
        carrier.frequency.exponentialRampToValueAtTime(980, now + 0.45);
        carrier.frequency.exponentialRampToValueAtTime(400, now + 0.85);

        modulator.type = 'sawtooth';
        modulator.frequency.setValueAtTime(18, now + 0.1);
        modGain.gain.setValueAtTime(250, now + 0.1);

        modulator.connect(modGain);
        modGain.connect(carrier.frequency);

        cackleGain.gain.setValueAtTime(0.001, now);
        cackleGain.gain.linearRampToValueAtTime(0.35 * this.volume, now + 0.15);
        cackleGain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);

        carrier.connect(cackleGain);
        cackleGain.connect(ctx.destination);

        modulator.start(now + 0.1);
        carrier.start(now + 0.1);
        modulator.stop(now + 0.95);
        carrier.stop(now + 0.95);

        // Demonic "I WANT MY GOLD!" Voice Scream
        this.playVoiceLine();
      }

      // 6. Authentic Warwick Davis Movie Voice Scream ("I want me gold! Give it to me!")
      playVoiceLine() {
        if (!this.enabled) return;
        if (typeof window !== 'undefined' && window.LEPRECHAUN_VOICE_DATA) {
          try {
            const snd = new Audio(window.LEPRECHAUN_VOICE_DATA);
            snd.volume = Math.min(1.0, this.volume * 1.35);
            snd.play().catch(() => {});
            return;
          } catch(e) {}
        }
        if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
          try {
            const utter = new SpeechSynthesisUtterance("I want me gold!");
            utter.pitch = 0.55;
            utter.rate = 1.15;
            utter.volume = Math.min(1.0, this.volume);
            window.speechSynthesis.speak(utter);
          } catch(e) {}
        }
      }

      // 7. Snatch & Vanish Whoosh
      playSnatchVanish() {
        if (!this.enabled) return;
        const ctx = this.ensureContext();
        if (!ctx) return;
        const now = ctx.currentTime;

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(700, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.25);

        gain.gain.setValueAtTime(0.35 * this.volume, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.3);
      }
    }

    // Drawing the Parabolic Rainbow Arc
    function drawRainbowArc(c, startX, startY, endX, endY, progress, isCrackle) {
      if (progress <= 0) return;
      const colors = isCrackle ? [
        'rgba(34, 197, 94, 0.95)',
        'rgba(74, 222, 128, 0.95)',
        'rgba(16, 185, 129, 0.95)',
        'rgba(240, 253, 244, 1)',
        'rgba(34, 197, 94, 0.95)'
      ] : [
        'rgba(239, 68, 68, 0.85)',   // Red
        'rgba(249, 115, 22, 0.85)',  // Orange
        'rgba(234, 179, 8, 0.85)',   // Yellow
        'rgba(34, 197, 94, 0.85)',   // Green
        'rgba(59, 130, 246, 0.85)',  // Blue
        'rgba(99, 102, 241, 0.85)',  // Indigo
        'rgba(168, 85, 247, 0.85)'   // Violet
      ];

      const ctrlX = (startX + endX) / 2 + (startX < endX ? -50 : 50);
      const ctrlY = Math.min(startY, endY) - canvas.height * 0.38;

      c.save();
      c.lineCap = 'round';
      const bandWidth = isCrackle ? 8 : 6;
      const totalWidth = colors.length * bandWidth;

      for (let i = 0; i < colors.length; i++) {
        const offset = (i - colors.length / 2) * bandWidth;
        c.beginPath();
        c.strokeStyle = colors[i];
        c.lineWidth = bandWidth;
        c.shadowColor = isCrackle ? '#22c55e' : colors[i];
        c.shadowBlur = isCrackle ? 24 : 12;

        const steps = Math.max(8, Math.floor(55 * progress));
        for (let s = 0; s <= steps; s++) {
          const t = Math.min(progress, s / 55);
          const bx = Math.pow(1 - t, 2) * startX + 2 * (1 - t) * t * ctrlX + Math.pow(t, 2) * endX;
          const by = Math.pow(1 - t, 2) * startY + 2 * (1 - t) * t * ctrlY + Math.pow(t, 2) * endY;
          const dx = 2 * (1 - t) * (ctrlX - startX) + 2 * t * (endX - ctrlX);
          const dy = 2 * (1 - t) * (ctrlY - startY) + 2 * t * (endY - ctrlY);
          const len = Math.hypot(dx, dy) || 1;
          const px = bx - (dy / len) * offset;
          const py = by + (dx / len) * offset;

          if (s === 0) c.moveTo(px, py);
          else c.lineTo(px, py);
        }
        c.stroke();
      }
      c.restore();

      // Emit star dust particles along leading edge
      if (progress < 1 && Math.random() < 0.65) {
        const t = progress;
        const bx = Math.pow(1 - t, 2) * startX + 2 * (1 - t) * t * ctrlX + Math.pow(t, 2) * endX;
        const by = Math.pow(1 - t, 2) * startY + 2 * (1 - t) * t * ctrlY + Math.pow(t, 2) * endY;
        rainbowStars.push({
          x: bx + (Math.random() - 0.5) * totalWidth,
          y: by + (Math.random() - 0.5) * totalWidth,
          vx: (Math.random() - 0.5) * 1.5,
          vy: Math.random() * 2 + 0.8,
          size: Math.random() * 3 + 2,
          alpha: 1,
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }
    }

    function drawLeprechaun(c, x, y, scale, angle, wink, tipHat, flip, skinKey) {

    // 4. Gold Coin Toss & Sparkles
    function spawnCoinBurst(x, y, skinKey) {

      const colors = skin.sparkColors;
      for (let i = 0; i < 24; i++) {

          x: x,

          size: Math.random() * 3 + 2,

        });
      }
    }

    function drawCloverShape(c, x, y, size) {
      c.save();
      c.translate(x, y);
      const leafR = size * 0.45;
      c.fillStyle = '#10b981';
      c.shadowColor = '#059669';
      c.shadowBlur = 8;
      // 4 Petals
      c.beginPath(); c.arc(0, -leafR, leafR, 0, Math.PI*2); c.fill();
      c.beginPath(); c.arc(0, leafR, leafR, 0, Math.PI*2); c.fill();
      c.beginPath(); c.arc(-leafR, 0, leafR, 0, Math.PI*2); c.fill();
      c.beginPath(); c.arc(leafR, 0, leafR, 0, Math.PI*2); c.fill();
      // Stem
      c.strokeStyle = '#047857';
      c.lineWidth = 2.5;
      c.beginPath();
      c.moveTo(0, 0);
      c.quadraticCurveTo(leafR * 0.4, leafR * 1.5, leafR * 0.8, leafR * 2.2);
      c.stroke();
      c.restore();
    }

    // Main 60fps Loop
    function loop(now) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Draw Ambient Floating Clovers
      for (let i = 0; i < clovers.length; i++) {
        const cl = clovers[i];
        cl.y += cl.speedY;
        cl.x += cl.speedX;
        cl.rot += cl.rotSpeed;

        if (cl.y < -30) { cl.y = canvas.height + 30; cl.x = Math.random() * canvas.width; }
        if (cl.x < -30) cl.x = canvas.width + 30;
        if (cl.x > canvas.width + 30) cl.x = -30;

        ctx.save();
        ctx.globalAlpha = cl.alpha;
        ctx.translate(cl.x, cl.y);
        ctx.rotate(cl.rot);
        drawCloverShape(ctx, 0, 0, cl.size);
        ctx.restore();
      }

      // 2. Auto-Trigger Peek Every 14 Seconds if Idle
      if (!leprechaun.active && (now - lastAutoPeekTime > 14000)) {
        startLeprechaunPeek();
        lastAutoPeekTime = now;
      }

      // 3. Update & Draw Peek-a-Boo Leprechaun
      if (leprechaun.active) {
        const spots = getSpots();
        const curSpot = spots[leprechaun.spotIndex] || spots[0];

        let currentY = curSpot.baseY;
        let tipHat = false;

        if (leprechaun.state === 'rising') {
          leprechaun.progress += 0.038;
          // Easing
          const ease = Math.sin((leprechaun.progress * Math.PI) / 2);
          currentY = curSpot.baseY + curSpot.peekOffset * ease;

          if (leprechaun.progress >= 1) {
            leprechaun.state = 'peeking';
            leprechaun.progress = 0;
            leprechaun.holdTimer = now;
            leprechaun.coinFlipping = true;
            leprechaun.coinY = 0;
            spawnCoinBurst(curSpot.x, currentY - 60, leprechaun.skinKey);
            lepAudio.playCoinFlip();
          }
        } else if (leprechaun.state === 'peeking') {
          const peekDuration = now - leprechaun.holdTimer;
          const bob = Math.sin(peekDuration * 0.004) * 3;
          currentY = curSpot.baseY + curSpot.peekOffset + bob;

          // Coin Flip Animation in Air!
          if (leprechaun.coinFlipping) {
            leprechaun.coinY = Math.sin((peekDuration / 2000) * Math.PI) * -65;
            leprechaun.coinRot += 0.22;
          }

          if (peekDuration > 2600) {
            leprechaun.state = 'hiding';
            leprechaun.progress = 0;
            lepAudio.playSnatchVanish();
          }
        } else if (leprechaun.state === 'hiding') {
          leprechaun.progress += 0.045;
          const ease = Math.cos((leprechaun.progress * Math.PI) / 2);
          currentY = curSpot.baseY + curSpot.peekOffset * ease;

          if (leprechaun.progress >= 1) {
            leprechaun.active = false;
            leprechaun.state = 'hidden';
            lastAutoPeekTime = now;
          }
        }

        const skinObj = LEP_SKINS[leprechaun.skinKey] || LEP_SKINS.pixar;
        const skinImg = lepImages[skinObj.id] || lepImages.pixar;

        // Draw Leprechaun at calculated spot
        drawLeprechaun(ctx, curSpot.x, currentY, curSpot.scale, curSpot.angle, leprechaun.wink, tipHat, curSpot.flip, leprechaun.skinKey);

        // Draw Spinning Celtic Gold Coin if flipping
        if (leprechaun.coinFlipping && leprechaun.state === 'peeking') {
          ctx.save();
          const spriteH = (skinImg.naturalHeight || 700) * curSpot.scale * (skinObj.scaleMul || 1.0);
          const coinX = curSpot.x + (curSpot.flip ? -45 : 45);
          const coinY = currentY - (spriteH * 0.55) + leprechaun.coinY;
          ctx.translate(coinX, coinY);
          ctx.scale(Math.cos(leprechaun.coinRot), 1);

          // Coin Body
          ctx.fillStyle = skinObj.coinFill;
          ctx.shadowColor = skinObj.coinShadow;
          ctx.shadowBlur = 14;
          ctx.beginPath();
          ctx.arc(0, 0, 11, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = skinObj.coinStroke;
          ctx.lineWidth = 1.5;
          ctx.stroke();

          // Symbol Stamped on Coin
          ctx.fillStyle = skinObj.coinStampColor;
          ctx.font = '10px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(skinObj.coinStamp, 0, 0);

          ctx.restore();
        }
      }

      // 4. Draw Coin Gold Sparkles
      for (let i = goldSparks.length - 1; i >= 0; i--) {
        const s = goldSparks[i];
        s.x += s.vx;
        s.y += s.vy;
        s.vy += 0.04;
        s.alpha -= 0.02;

        if (s.alpha <= 0) {
          goldSparks.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = s.alpha;
        ctx.fillStyle = s.color;
        ctx.shadowColor = s.color;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // ==========================================
      // 5. St. Patrick's Rainbow & Pot of Gold Jump-Scare Event
      // ==========================================
      if (rainbowScare.active) {
        const spots = getSpots();
        const curSpot = spots[rainbowScare.spotIndex] || spots[0];
        const elapsed = now - rainbowScare.timer;

        // Origin of Rainbow Arc (opposite tavern side)
        const startX = (curSpot.x < canvas.width / 2) ? canvas.width * 0.92 : canvas.width * 0.08;
        const startY = canvas.height * 0.08;
        const targetX = curSpot.x;
        const targetY = curSpot.baseY;

        ctx.save();
        if (rainbowScare.shakeX !== 0 || rainbowScare.shakeY !== 0) {
          ctx.translate(rainbowScare.shakeX, rainbowScare.shakeY);
        }

        if (rainbowScare.phase === 'arc') {
          rainbowScare.progress += 0.024;
          drawRainbowArc(ctx, startX, startY, targetX, targetY, Math.min(1, rainbowScare.progress), false);

          if (rainbowScare.progress >= 1) {
            rainbowScare.phase = 'pot';
            rainbowScare.timer = now;
            rainbowScare.potScale = 0;
            spawnCoinBurst(targetX, targetY - 40, 'pixar');
            lepAudio.playPotOfGoldLand();
          }

        } else if (rainbowScare.phase === 'pot') {
          drawRainbowArc(ctx, startX, startY, targetX, targetY, 1, false);

          const t = Math.min(1, elapsed / 350);
          rainbowScare.potScale = (curSpot.scale * 0.95) * (1 - Math.pow(1 - t, 3));
          rainbowScare.potAlpha = Math.min(1, elapsed / 200);

          const bob = Math.sin(elapsed * 0.005) * 3;
          drawPotOfGold(ctx, targetX, targetY - 25 + bob, rainbowScare.potScale, rainbowScare.potAlpha);

          if (elapsed > 1100) {
            rainbowScare.phase = 'crackle';
            rainbowScare.timer = now;
            lepAudio.playCrackleTrap();
            lepAudio.warpAndDuckBgm();
          }

        } else if (rainbowScare.phase === 'crackle') {
          rainbowScare.shakeX = (Math.random() - 0.5) * 14;
          rainbowScare.shakeY = (Math.random() - 0.5) * 14;
          drawRainbowArc(ctx, startX, startY, targetX, targetY, 1, true);

          drawPotOfGold(ctx, targetX, targetY - 25, curSpot.scale * 0.95, 1, 'rgba(34, 197, 94, 0.9)');

          if (elapsed > 240) {
            rainbowScare.phase = 'jumpscare';
            rainbowScare.timer = now;
            rainbowScare.jumpProgress = 0;
            spawnCoinBurst(targetX, targetY - 80, 'creepy');
            lepAudio.playHorrorJumpScare();
          }

        } else if (rainbowScare.phase === 'jumpscare') {
          rainbowScare.jumpProgress += 0.085;
          const ease = Math.min(1, rainbowScare.jumpProgress);

          if (elapsed < 380) {
            rainbowScare.shakeX = (Math.random() - 0.5) * 10;
            rainbowScare.shakeY = (Math.random() - 0.5) * 10;
          } else {
            rainbowScare.shakeX = 0;
            rainbowScare.shakeY = 0;
          }

          const lungeY = targetY + (curSpot.peekOffset * 1.35) * ease;
          const scareScale = curSpot.scale * 1.38;

          drawLeprechaun(ctx, targetX, lungeY, scareScale, curSpot.angle, false, false, curSpot.flip, 'creepy');
          drawPotOfGold(ctx, targetX, targetY - 20, curSpot.scale * 0.95, 1, 'rgba(34, 197, 94, 0.85)');

          // Shaking "I WANT MY GOLD!" Horror Comic Dialogue Bubble
          if (elapsed > 160 && elapsed < 2150) {
            ctx.save();
            const bubbleAlpha = Math.min(1, (elapsed - 160) / 120);
            const textShakeX = (Math.random() - 0.5) * 6;
            const textShakeY = (Math.random() - 0.5) * 6;
            const creepyImg = lepImages.creepy;
            const spriteH = (creepyImg && creepyImg.naturalHeight ? creepyImg.naturalHeight : 660) * scareScale * 0.95;
            const bubbleY = lungeY - spriteH - 18;

            ctx.translate(targetX + textShakeX, bubbleY + textShakeY);
            ctx.globalAlpha = bubbleAlpha;

            const textStr = "I WANT ME GOLD!";
            ctx.font = '900 24px Impact, "Arial Black", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const m = ctx.measureText(textStr);
            const pw = m.width + 36;
            const ph = 44;

            ctx.fillStyle = 'rgba(10, 10, 10, 0.94)';
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 3;
            ctx.shadowColor = 'rgba(239, 68, 68, 0.95)';
            ctx.shadowBlur = 20;

            ctx.beginPath();
            if (typeof ctx.roundRect === 'function') {
              ctx.roundRect(-pw / 2, -ph / 2, pw, ph, 12);
            } else {
              ctx.rect(-pw / 2, -ph / 2, pw, ph);
            }
            ctx.fill();
            ctx.stroke();

            // Downward pointer spike pointing towards his mouth
            ctx.beginPath();
            ctx.moveTo(-10, ph / 2 - 1);
            ctx.lineTo(0, ph / 2 + 14);
            ctx.lineTo(10, ph / 2 - 1);
            ctx.fillStyle = '#ef4444';
            ctx.fill();

            // Shouted Celtic Gold Text
            ctx.shadowColor = '#fbbf24';
            ctx.shadowBlur = 10;
            ctx.fillStyle = '#fbbf24';
            ctx.fillText(textStr, 0, 0);

            ctx.restore();
          }

          if (elapsed > 2200) {
            rainbowScare.phase = 'retreat';
            rainbowScare.timer = now;
            rainbowScare.progress = 0;
            lepAudio.playSnatchVanish();
          }

        } else if (rainbowScare.phase === 'retreat') {
          rainbowScare.progress += 0.04;
          const ease = Math.sin((rainbowScare.progress * Math.PI) / 2);
          const retreatY = targetY + (curSpot.peekOffset * 1.35) * (1 - ease);
          const fadeAlpha = 1 - ease;

          drawLeprechaun(ctx, targetX, retreatY, curSpot.scale * (1.38 - ease * 0.4), curSpot.angle, false, false, curSpot.flip, 'creepy');
          drawPotOfGold(ctx, targetX, targetY - 20, curSpot.scale * 0.95 * (1 - ease * 0.5), fadeAlpha);

          if (rainbowScare.progress >= 1) {
            rainbowScare.active = false;
            rainbowScare.phase = 'idle';
            rainbowScare.shakeX = 0;
            rainbowScare.shakeY = 0;
            lastAutoPeekTime = now;
            lepAudio.restoreBgm();
          }
        }

        ctx.restore();
      }

      // 6. Draw Rainbow Falling Stars
      for (let sIdx = rainbowStars.length - 1; sIdx >= 0; sIdx--) {
        const star = rainbowStars[sIdx];
        star.x += star.vx;
        star.y += star.vy;
        star.alpha -= 0.025;
        if (star.alpha <= 0) {
          rainbowStars.splice(sIdx, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = star.alpha;
        ctx.fillStyle = star.color;
        ctx.shadowColor = star.color;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 7. Draw Bottom Dancing Leprechaun (Jig Dancer)
      if (dancingLeprechaun.enabled && dancingLepImg.complete && dancingLepImg.naturalWidth > 0) {
        const danceTime = now * 0.0075;
        // Rhythmic step bounce
        const bounceY = -Math.abs(Math.sin(danceTime * 2)) * 16;
        // Heel tap & body sway tilt
        const tiltAngle = Math.sin(danceTime) * 0.08;
        // Stretch & squash on step impact
        const squash = 1 + Math.sin(danceTime * 2) * 0.035;

        let posX = canvas.width * 0.5;
        if (dancingLeprechaun.position === 'right') posX = canvas.width * 0.88;
        else if (dancingLeprechaun.position === 'left') posX = canvas.width * 0.12;

        const posY = canvas.height - 12 + bounceY;
        const dw = dancingLepImg.naturalWidth * dancingLeprechaun.scale;
        const dh = dancingLepImg.naturalHeight * dancingLeprechaun.scale * squash;

        // Emit lucky green sparkles and gold coins from tapping feet
        if (Math.random() < 0.4) {
          dancingLeprechaun.particles.push({
            x: posX + (Math.random() - 0.5) * (dw * 0.6),
            y: canvas.height - 15,
            vx: (Math.random() - 0.5) * 2.5,
            vy: -Math.random() * 2.5 - 1.2,
            size: Math.random() * 3 + 2,
            alpha: 1,
            color: Math.random() < 0.6 ? '#22c55e' : '#fbbf24'
          });
        }

        // Draw dancing sparkles
        for (let pIdx = dancingLeprechaun.particles.length - 1; pIdx >= 0; pIdx--) {
          const p = dancingLeprechaun.particles[pIdx];
          p.x += p.vx;
          p.y += p.vy;
          p.alpha -= 0.025;
          if (p.alpha <= 0) {
            dancingLeprechaun.particles.splice(pIdx, 1);
            continue;
          }
          ctx.save();
          ctx.globalAlpha = p.alpha;
          ctx.fillStyle = p.color;
          ctx.shadowColor = p.color;
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // Render Dancing Leprechaun
        ctx.save();
        ctx.translate(posX, posY);
        ctx.rotate(tiltAngle);
        ctx.shadowColor = 'rgba(34, 197, 94, 0.45)';
        ctx.shadowBlur = 20;
        ctx.drawImage(dancingLepImg, -dw / 2, -dh, dw, dh);
        ctx.restore();
      }

      requestAnimationFrame(loop);
    }

    // Auto-trigger on page load
    setTimeout(startLeprechaunPeek, 800);
    requestAnimationFrame(loop);
  </script>
</body>
</html>
