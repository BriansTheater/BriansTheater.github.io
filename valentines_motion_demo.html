<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentine's Motion & Pole Design Demo — Brian's Theater</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0c020d;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    #stageContainer {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: url('images/valentines_stream_background.jpg') center center / cover no-repeat;
    }
    #effectCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    .demo-pill {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(244, 63, 94, 0.4);
      transition: all 0.25s ease;
    }
    .demo-pill.active {
      background: linear-gradient(135deg, #e11d48 0%, #be123c 100%);
      border-color: #fda4af;
      box-shadow: 0 0 20px rgba(225, 29, 72, 0.6);
      transform: translateY(-2px);
    }
    .pole-pill {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.3);
      transition: all 0.25s ease;
    }
    .pole-pill.active {
      background: linear-gradient(135deg, #ec4899 0%, #a855f7 100%);
      border-color: #f472b6;
      box-shadow: 0 0 20px rgba(236, 72, 153, 0.55);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div id="stageContainer">
    <!-- Top Interactive Mode Switcher -->
    <header class="absolute top-4 left-1/2 -translate-x-1/2 z-30 flex flex-col items-center gap-2.5 max-w-4xl w-full px-4">
      <!-- Title Badge -->
      <div class="px-5 py-1.5 rounded-full bg-slate-950/85 backdrop-blur-md border border-rose-500/40 shadow-xl flex items-center gap-2">
        <span class="text-rose-400 text-base">💖</span>
        <span class="text-xs uppercase tracking-widest font-black text-rose-200">Valentine's Motion & Pole Design Studio</span>
      </div>

      <!-- Row 1: Pole Design Switcher (Option A vs Option B) -->
      <div class="flex items-center gap-2 p-1.5 rounded-2xl bg-black/80 backdrop-blur-md border border-purple-500/40 shadow-2xl">
        <span class="text-[11px] font-mono font-bold text-purple-300 px-2 uppercase tracking-wider">Left Set Piece:</span>
        <button id="btnPoleA" onclick="setPoleDesign('pole')" class="pole-pill active px-4 py-1.5 rounded-xl text-xs sm:text-sm font-black flex items-center gap-2 cursor-pointer">
          <span>💈</span> <span>Option A: Keep Pole (Electric Neon & Fairy Lights)</span>
        </button>
        <button id="btnPoleB" onclick="setPoleDesign('candy')" class="pole-pill px-4 py-1.5 rounded-xl text-xs sm:text-sm font-black flex items-center gap-2 cursor-pointer">
          <span>🍬</span> <span>Option B: Conversation Candy Hearts (No Pole)</span>
        </button>
      </div>

      <!-- Row 2: Motion FX Switcher -->
      <nav class="flex items-center gap-2 p-1 rounded-2xl bg-black/70 backdrop-blur-md border border-slate-800 shadow-xl">
        <span class="text-[11px] font-mono font-bold text-slate-400 px-2 uppercase tracking-wider">Atmospheric FX:</span>
        <button id="btnOpt1" onclick="switchMode('cupid')" class="demo-pill px-3 py-1 rounded-xl text-xs font-bold flex items-center gap-1.5 cursor-pointer">
          <span>💘</span> <span>Cupid's Arrow</span>
        </button>
        <button id="btnOpt2" onclick="switchMode('petals')" class="demo-pill px-3 py-1 rounded-xl text-xs font-bold flex items-center gap-1.5 cursor-pointer">
          <span>🌹</span> <span>Rose Petals</span>
        </button>
        <button id="btnOpt3" onclick="switchMode('neon')" class="demo-pill px-3 py-1 rounded-xl text-xs font-bold flex items-center gap-1.5 cursor-pointer">
          <span>💖</span> <span>Neon Lanterns</span>
        </button>
        <button id="btnOpt4" onclick="switchMode('deluxe')" class="demo-pill active px-3 py-1 rounded-xl text-xs font-bold flex items-center gap-1.5 cursor-pointer">
          <span>✨</span> <span>Deluxe Combo</span>
        </button>
      </nav>
    </header>

    <!-- Center Mock Movie Card (to visualize theater clearance) -->
    <div class="relative z-20 w-[420px] aspect-[16/9] rounded-2xl border-2 border-rose-500/50 shadow-[0_0_40px_rgba(244,63,94,0.3)] overflow-hidden bg-slate-950 flex flex-col items-center justify-center p-6 text-center">
      <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-black/40"></div>
      <span class="relative z-10 text-xs font-mono font-bold tracking-widest text-rose-400 uppercase">Brian's Moonlight Drive-In</span>
      <h1 class="relative z-10 text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-rose-300 via-pink-200 to-rose-400 drop-shadow mt-1">Moana</h1>
      <p class="relative z-10 text-xs text-slate-400 mt-2 font-mono">Drive-In Opens In: 02d 06h 31m 05s</p>
    </div>

    <!-- Active Motion Effect Canvas -->
    <canvas id="effectCanvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('effectCanvas');
    const ctx = canvas.getContext('2d');

    let poleDesign = 'pole'; // 'pole' or 'candy'
    let currentMode = 'deluxe'; // 'cupid', 'petals', 'neon', 'deluxe'
    let animId = null;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 1. Cupid's Arrow Engine
    let cupidArrows = [];
    let cupidSparks = [];
    let lastArrowTime = 0;

    function spawnCupidArrow() {
      cupidArrows.push({
        x: -50,
        y: Math.random() * (canvas.height * 0.22) + 60,
        vx: Math.random() * 4 + 7,
        vy: (Math.random() - 0.2) * 1.5,
        targetX: canvas.width * 0.72 + Math.random() * 100,
        trail: [],
        fizzled: false
      });
    }

    function burstCupidStardust(x, y) {
      const sparkCount = 38;
      for (let i = 0; i < sparkCount; i++) {
        const angle = (Math.PI * 2 / sparkCount) * i + (Math.random() - 0.5) * 0.4;
        const speed = Math.random() * 3.5 + 1.2;
        cupidSparks.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 0.5,
          alpha: 1,
          size: Math.random() * 3 + 2,
          isHeart: i % 3 === 0,
          color: i % 2 === 0 ? '#fbbf24' : '#f43f5e'
        });
      }
    }

    // 2. 3D Tumbling Rose Petals Engine
    let rosePetals = [];
    const PETAL_COUNT = 32;

    function initRosePetals() {
      rosePetals = [];
      for (let i = 0; i < PETAL_COUNT; i++) {
        rosePetals.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 12 + 10,
          speedY: Math.random() * 1.2 + 0.6,
          speedX: Math.random() * 1.5 + 0.5,
          rotX: Math.random() * Math.PI,
          rotY: Math.random() * Math.PI,
          rotZ: Math.random() * Math.PI,
          rotSpeedX: (Math.random() - 0.5) * 0.035,
          rotSpeedY: (Math.random() - 0.5) * 0.045,
          rotSpeedZ: (Math.random() - 0.5) * 0.025,
          swayPhase: Math.random() * Math.PI * 2,
          alpha: Math.random() * 0.4 + 0.6,
          shade: i % 3
        });
      }
    }

    // 3. Neon Heart Lanterns Engine
    let neonHearts = [];
    const NEON_COUNT = 24;

    function initNeonHearts() {
      neonHearts = [];
      for (let i = 0; i < NEON_COUNT; i++) {
        neonHearts.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 14 + 10,
          speedY: -(Math.random() * 0.8 + 0.4),
          speedX: (Math.random() - 0.5) * 0.5,
          pulse: Math.random() * Math.PI * 2,
          alpha: Math.random() * 0.5 + 0.4,
          glowColor: i % 2 === 0 ? '#f43f5e' : '#ec4899'
        });
      }
    }

    function drawHeartShape(c, x, y, size) {
      c.beginPath();
      const topCurveHeight = size * 0.3;
      c.moveTo(x, y + topCurveHeight);
      c.bezierCurveTo(x, y, x - size / 2, y, x - size / 2, y + topCurveHeight);
      c.bezierCurveTo(x - size / 2, y + (size + topCurveHeight) / 2, x, y + (size + topCurveHeight) / 2, x, y + size);
      c.bezierCurveTo(x, y + (size + topCurveHeight) / 2, x + size / 2, y + (size + topCurveHeight) / 2, x + size / 2, y + topCurveHeight);
      c.bezierCurveTo(x + size / 2, y, x, y, x, y + topCurveHeight);
      c.closePath();
    }

    // 4. Conversation Candy Heart Renderer (Option B)
    function drawCandyHeart(c, x, y, size, text, baseColor, angle, timeOffset) {
      const floatY = Math.sin((Date.now() / 1000) * 1.5 + timeOffset) * 6;
      c.save();
      c.translate(x, y + floatY);
      c.rotate(angle);

      // Heart Soft Drop Shadow & Ambient Glow
      c.shadowColor = baseColor;
      c.shadowBlur = 24;

      // 3D Extrusion Side/Thickness
      c.fillStyle = 'rgba(0, 0, 0, 0.4)';
      drawHeartShape(c, 0, 6, size);
      c.fill();

      // Front Face
      const grad = c.createLinearGradient(-size/2, -size/2, size/2, size/2);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.3, baseColor);
      grad.addColorStop(1, adjustColorBrightness(baseColor, -25));
      c.fillStyle = grad;
      drawHeartShape(c, 0, 0, size);
      c.fill();

      // Delicate Bevel Highlight
      c.strokeStyle = 'rgba(255, 255, 255, 0.6)';
      c.lineWidth = 2.5;
      c.shadowBlur = 0;
      drawHeartShape(c, 0, 0, size);
      c.stroke();

      // Stamped Red Typography (Authentic Sweethearts Look)
      c.fillStyle = '#be123c';
      c.font = `900 ${Math.floor(size * 0.22)}px "Arial Black", Impact, sans-serif`;
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      c.letterSpacing = '1px';
      c.shadowColor = 'rgba(255, 255, 255, 0.4)';
      c.shadowBlur = 2;
      c.fillText(text, 0, size * 0.48);

      c.restore();
    }

    function adjustColorBrightness(hex, percent) {
      let num = parseInt(hex.replace('#',''), 16),
      amt = Math.round(2.55 * percent),
      R = (num >> 16) + amt,
      G = (num >> 8 & 0x00FF) + amt,
      B = (num & 0x0000FF) + amt;
      return '#' + (0x1000000 + (R<255?R<1?0:R:255)*0x10000 + (G<255?G<1?0:G:255)*0x100 + (B<255?B<1?0:B:255)).toString(16).slice(1);
    }

    // Main 60fps Animation Loop
    function loop(now) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // ==========================================
      // 1. POLE DESIGN LAYER (OPTION A VS OPTION B)
      // ==========================================
      if (poleDesign === 'pole') {
        // --- OPTION A: ELECTRIC NEON PULSE ON SPEAKER POLE ---
        const timeSec = now / 1000;
        const poleX = canvas.width * 0.088;
        const topHeartY = canvas.height * 0.28;
        const btmHeartY = canvas.height * 0.79;
        const heartRadius = canvas.height * 0.085;

        // Dynamic electric pulse (organic breathing + subtle flicker)
        const pulseTop = Math.sin(timeSec * 2.8) * 0.18 + 0.88;
        const flicker = (Math.random() > 0.985) ? 0.35 : 1; // occasional vintage neon flicker

        // Glow layer for Top Neon Heart on Pole
        ctx.save();
        ctx.strokeStyle = '#f43f5e';
        ctx.shadowColor = '#fb7185';
        ctx.shadowBlur = 30 * pulseTop * flicker;
        ctx.lineWidth = 3.5;
        ctx.globalAlpha = 0.85 * flicker;
        drawHeartShape(ctx, poleX, topHeartY - heartRadius * 0.5, heartRadius);
        ctx.stroke();

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.8;
        ctx.shadowBlur = 10;
        drawHeartShape(ctx, poleX, topHeartY - heartRadius * 0.5, heartRadius);
        ctx.stroke();
        ctx.restore();

        // Glow layer for Bottom Neon Heart on Pole
        const pulseBtm = Math.cos(timeSec * 2.4) * 0.18 + 0.88;
        ctx.save();
        ctx.strokeStyle = '#f43f5e';
        ctx.shadowColor = '#fb7185';
        ctx.shadowBlur = 32 * pulseBtm * flicker;
        ctx.lineWidth = 3.5;
        ctx.globalAlpha = 0.85 * flicker;
        drawHeartShape(ctx, poleX + 2, btmHeartY - heartRadius * 0.5, heartRadius * 0.92);
        ctx.stroke();

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.8;
        ctx.shadowBlur = 10;
        drawHeartShape(ctx, poleX + 2, btmHeartY - heartRadius * 0.5, heartRadius * 0.92);
        ctx.stroke();
        ctx.restore();

        // Twinkling Golden Fairy Lights Spiraling the Pole
        const fairyY = [0.12, 0.18, 0.23, 0.35, 0.39, 0.49, 0.53, 0.61, 0.67, 0.73, 0.85, 0.92];
        for (let i = 0; i < fairyY.length; i++) {
          const fx = poleX + Math.sin(timeSec * 1.5 + i) * (canvas.width * 0.015);
          const fy = canvas.height * fairyY[i];
          const twinkle = Math.sin(timeSec * 4 + i * 1.2) * 0.35 + 0.65;

          ctx.save();
          ctx.beginPath();
          ctx.arc(fx, fy, 2.5 * twinkle, 0, Math.PI * 2);
          ctx.fillStyle = '#fef08a';
          ctx.shadowColor = '#fbbf24';
          ctx.shadowBlur = 14 * twinkle;
          ctx.globalAlpha = twinkle;
          ctx.fill();
          ctx.restore();
        }

        // Ambient Sign Backlight for DWARF, SOUL, AXEL
        const signY = [canvas.height * 0.45, canvas.height * 0.54, canvas.height * 0.63];
        for (let i = 0; i < signY.length; i++) {
          ctx.save();
          ctx.fillStyle = 'rgba(244, 63, 94, 0.04)';
          ctx.shadowColor = '#f43f5e';
          ctx.shadowBlur = 20;
          ctx.fillRect(poleX - 55, signY[i] - 18, 110, 36);
          ctx.restore();
        }

      } else {
        // --- OPTION B: CONVERSATION CANDY HEARTS (NO POLE) ---
        // 1. Soft dark twilight mask over the left pole
        ctx.save();
        const maskGrad = ctx.createLinearGradient(0, 0, canvas.width * 0.22, 0);
        maskGrad.addColorStop(0, 'rgba(12, 2, 13, 0.96)');
        maskGrad.addColorStop(0.7, 'rgba(12, 2, 13, 0.85)');
        maskGrad.addColorStop(1, 'rgba(12, 2, 13, 0)');
        ctx.fillStyle = maskGrad;
        ctx.fillRect(0, 0, canvas.width * 0.22, canvas.height);
        ctx.restore();

        // 2. Cluster of Oversized Glowing Conversation Candy Hearts
        const heartSize = canvas.height * 0.12;
        const baseX = canvas.width * 0.095;

        // Heart 1: "DWARF" (Candy Pink)
        drawCandyHeart(ctx, baseX - 15, canvas.height * 0.35, heartSize, 'DWARF', '#f472b6', -0.12, 0);

        // Heart 2: "SOUL" (Pastel Lavender)
        drawCandyHeart(ctx, baseX + 25, canvas.height * 0.48, heartSize * 0.95, 'SOUL', '#c084fc', 0.15, 1.2);

        // Heart 3: "AXEL" (Mint Green)
        drawCandyHeart(ctx, baseX - 20, canvas.height * 0.62, heartSize * 0.92, 'AXEL', '#6ee7b7', -0.08, 2.4);

        // Heart 4: "BE MINE" (Rose Coral)
        drawCandyHeart(ctx, baseX + 18, canvas.height * 0.75, heartSize * 1.05, 'BE MINE', '#fb7185', 0.18, 3.6);

        // Decorative Fairy Lights around the Hearts
        for (let i = 0; i < 8; i++) {
          const fx = baseX + (Math.sin(i * 1.4) * 60);
          const fy = canvas.height * (0.32 + i * 0.06);
          const twinkle = Math.sin((now / 1000) * 3 + i) * 0.3 + 0.7;

          ctx.save();
          ctx.beginPath();
          ctx.arc(fx, fy, 2.2 * twinkle, 0, Math.PI * 2);
          ctx.fillStyle = '#fef08a';
          ctx.shadowColor = '#fbbf24';
          ctx.shadowBlur = 12 * twinkle;
          ctx.globalAlpha = twinkle * 0.85;
          ctx.fill();
          ctx.restore();
        }
      }

      // ==========================================
      // 2. ATMOSPHERIC MOTION EFFECTS LAYER
      // ==========================================
      const showCupid = currentMode === 'cupid' || currentMode === 'deluxe';
      const showPetals = currentMode === 'petals' || currentMode === 'deluxe';
      const showNeon = currentMode === 'neon' || currentMode === 'deluxe';

      // --- A. NEON HEART LANTERNS ---
      if (showNeon) {
        for (let i = 0; i < neonHearts.length; i++) {
          const nh = neonHearts[i];
          nh.y += nh.speedY;
          nh.x += nh.speedX;
          nh.pulse += 0.04;

          if (nh.y < -30) { nh.y = canvas.height + 30; nh.x = Math.random() * canvas.width; }
          if (nh.x < -30) nh.x = canvas.width + 30;
          if (nh.x > canvas.width + 30) nh.x = -30;

          const currentPulse = Math.sin(nh.pulse) * 0.15 + 1;

          ctx.save();
          ctx.strokeStyle = nh.glowColor;
          ctx.shadowColor = nh.glowColor;
          ctx.shadowBlur = 12 * currentPulse;
          ctx.lineWidth = 2;
          ctx.globalAlpha = nh.alpha * (Math.sin(nh.pulse * 0.7) * 0.2 + 0.8);
          drawHeartShape(ctx, nh.x, nh.y, nh.size * currentPulse);
          ctx.stroke();

          ctx.fillStyle = nh.glowColor;
          ctx.globalAlpha = 0.08 * currentPulse;
          ctx.fill();
          ctx.restore();
        }
      }

      // --- B. 3D TUMBLING ROSE PETALS ---
      if (showPetals) {
        for (let i = 0; i < rosePetals.length; i++) {
          const p = rosePetals[i];
          p.swayPhase += 0.03;
          p.y += p.speedY;
          p.x += p.speedX + Math.sin(p.swayPhase) * 0.8;
          p.rotX += p.rotSpeedX;
          p.rotY += p.rotSpeedY;
          p.rotZ += p.rotSpeedZ;

          if (p.y > canvas.height + 25) { p.y = -25; p.x = Math.random() * canvas.width; }
          if (p.x > canvas.width + 25) p.x = -25;

          const scaleX = Math.cos(p.rotX);
          const scaleY = Math.sin(p.rotY);

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rotZ);
          ctx.scale(Math.max(0.2, Math.abs(scaleX)), Math.max(0.2, Math.abs(scaleY)));

          const grad = ctx.createRadialGradient(0, 0, 1, 0, 0, p.size);
          if (p.shade === 0) {
            grad.addColorStop(0, '#f43f5e');
            grad.addColorStop(0.7, '#be123c');
            grad.addColorStop(1, '#881337');
          } else if (p.shade === 1) {
            grad.addColorStop(0, '#fb7185');
            grad.addColorStop(0.7, '#e11d48');
            grad.addColorStop(1, '#9f1239');
          } else {
            grad.addColorStop(0, '#fda4af');
            grad.addColorStop(0.7, '#f43f5e');
            grad.addColorStop(1, '#be123c');
          }

          ctx.fillStyle = grad;
          ctx.globalAlpha = p.alpha;
          ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
          ctx.shadowBlur = 6;

          ctx.beginPath();
          ctx.moveTo(0, -p.size * 0.9);
          ctx.bezierCurveTo(p.size * 0.7, -p.size * 0.6, p.size * 0.8, p.size * 0.6, 0, p.size * 0.9);
          ctx.bezierCurveTo(-p.size * 0.8, p.size * 0.6, -p.size * 0.7, -p.size * 0.6, 0, -p.size * 0.9);
          ctx.fill();

          ctx.restore();
        }
      }

      // --- C. CUPID'S GOLDEN STARDUST ARROW ---
      if (showCupid) {
        if (now - lastArrowTime > 6500) {
          spawnCupidArrow();
          lastArrowTime = now;
        }

        for (let i = cupidArrows.length - 1; i >= 0; i--) {
          const arr = cupidArrows[i];
          arr.x += arr.vx;
          arr.y += arr.vy;
          arr.trail.push({ x: arr.x, y: arr.y, alpha: 1 });

          for (let t = arr.trail.length - 1; t >= 0; t--) {
            const tr = arr.trail[t];
            tr.alpha -= 0.035;
            if (tr.alpha <= 0) {
              arr.trail.splice(t, 1);
              continue;
            }
            ctx.save();
            ctx.beginPath();
            ctx.arc(tr.x, tr.y, (1 - tr.alpha) * 4 + 1.5, 0, Math.PI * 2);
            ctx.fillStyle = t % 2 === 0 ? '#fbbf24' : '#f43f5e';
            ctx.shadowColor = '#f59e0b';
            ctx.shadowBlur = 10;
            ctx.globalAlpha = tr.alpha * 0.8;
            ctx.fill();
            ctx.restore();
          }

          ctx.save();
          ctx.translate(arr.x, arr.y);
          const angle = Math.atan2(arr.vy, arr.vx);
          ctx.rotate(angle);

          // Arrow Shaft
          ctx.beginPath();
          ctx.moveTo(-32, 0);
          ctx.lineTo(8, 0);
          ctx.strokeStyle = '#fef08a';
          ctx.lineWidth = 2.5;
          ctx.shadowColor = '#fbbf24';
          ctx.shadowBlur = 12;
          ctx.stroke();

          // Golden Heart Arrowhead
          ctx.fillStyle = '#f43f5e';
          ctx.strokeStyle = '#fbbf24';
          ctx.lineWidth = 1.5;
          ctx.shadowColor = '#fbbf24';
          ctx.shadowBlur = 14;
          drawHeartShape(ctx, 10, -5, 12);
          ctx.fill();
          ctx.stroke();

          // Feather Fletchings
          ctx.beginPath();
          ctx.moveTo(-32, 0);
          ctx.lineTo(-40, -6);
          ctx.moveTo(-32, 0);
          ctx.lineTo(-40, 6);
          ctx.strokeStyle = '#fbbf24';
          ctx.lineWidth = 2;
          ctx.stroke();

          ctx.restore();

          if (arr.x >= arr.targetX) {
            burstCupidStardust(arr.x, arr.y);
            cupidArrows.splice(i, 1);
          }
        }

        // Sparks
        for (let i = cupidSparks.length - 1; i >= 0; i--) {
          const s = cupidSparks[i];
          s.x += s.vx;
          s.y += s.vy;
          s.vy += 0.04;
          s.alpha -= 0.016;

          if (s.alpha <= 0) {
            cupidSparks.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.globalAlpha = s.alpha;
          ctx.fillStyle = s.color;
          ctx.shadowColor = s.color;
          ctx.shadowBlur = 8;

          if (s.isHeart) {
            drawHeartShape(ctx, s.x, s.y, s.size * 2);
            ctx.fill();
          } else {
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
      }

      animId = requestAnimationFrame(loop);
    }

    function setPoleDesign(design) {
      poleDesign = design;
      document.querySelectorAll('.pole-pill').forEach(b => b.classList.remove('active'));
      if (design === 'pole') {
        document.getElementById('btnPoleA').classList.add('active');
      } else {
        document.getElementById('btnPoleB').classList.add('active');
      }
    }

    function switchMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.demo-pill').forEach(b => b.classList.remove('active'));

      if (mode === 'cupid') {
        document.getElementById('btnOpt1').classList.add('active');
        spawnCupidArrow();
      } else if (mode === 'petals') {
        document.getElementById('btnOpt2').classList.add('active');
      } else if (mode === 'neon') {
        document.getElementById('btnOpt3').classList.add('active');
      } else if (mode === 'deluxe') {
        document.getElementById('btnOpt4').classList.add('active');
        spawnCupidArrow();
      }
    }

    // Initialize & Start
    initRosePetals();
    initNeonHearts();
    spawnCupidArrow();
    animId = requestAnimationFrame(loop);
  </script>
</body>
</html>
