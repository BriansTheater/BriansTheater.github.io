<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentine's Motion Effects Demo — Brian's Theater</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0c020d;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    #stageContainer {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: url('images/valentines_stream_background.jpg') center center / cover no-repeat;
    }
    #effectCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    .demo-pill {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(244, 63, 94, 0.4);
      transition: all 0.25s ease;
    }
    .demo-pill.active {
      background: linear-gradient(135deg, #e11d48 0%, #be123c 100%);
      border-color: #fda4af;
      box-shadow: 0 0 20px rgba(225, 29, 72, 0.6);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div id="stageContainer">
    <!-- Top Interactive Mode Switcher -->
    <header class="absolute top-6 left-1/2 -translate-x-1/2 z-30 flex flex-col items-center gap-3">
      <div class="px-5 py-2 rounded-full bg-slate-950/80 backdrop-blur-md border border-rose-500/40 shadow-xl flex items-center gap-2">
        <span class="text-rose-400 text-lg">💖</span>
        <span class="text-xs uppercase tracking-widest font-bold text-rose-200">Valentine's Motion FX Studio Demo</span>
      </div>

      <nav class="flex items-center gap-2 p-1.5 rounded-2xl bg-black/70 backdrop-blur-md border border-slate-800 shadow-2xl">
        <button id="btnOpt1" onclick="switchMode('cupid')" class="demo-pill px-4 py-2 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-2 cursor-pointer">
          <span>💘</span> <span>1. Cupid's Arrow</span>
        </button>
        <button id="btnOpt2" onclick="switchMode('petals')" class="demo-pill px-4 py-2 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-2 cursor-pointer">
          <span>🌹</span> <span>2. Tumbling Rose Petals</span>
        </button>
        <button id="btnOpt3" onclick="switchMode('neon')" class="demo-pill px-4 py-2 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-2 cursor-pointer">
          <span>💖</span> <span>3. Neon Heart Lanterns</span>
        </button>
        <button id="btnOpt4" onclick="switchMode('deluxe')" class="demo-pill active px-4 py-2 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-2 cursor-pointer">
          <span>✨</span> <span>4. Deluxe Combo</span>
        </button>
      </nav>
    </header>

    <!-- Center Mock Movie Card (to visualize theater clearance) -->
    <div class="relative z-20 w-[420px] aspect-[16/9] rounded-2xl border-2 border-rose-500/50 shadow-[0_0_40px_rgba(244,63,94,0.3)] overflow-hidden bg-slate-950 flex flex-col items-center justify-center p-6 text-center">
      <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-black/40"></div>
      <span class="relative z-10 text-xs font-mono font-bold tracking-widest text-rose-400 uppercase">Brian's Moonlight Drive-In</span>
      <h1 class="relative z-10 text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-rose-300 via-pink-200 to-rose-400 drop-shadow mt-1">Moana</h1>
      <p class="relative z-10 text-xs text-slate-400 mt-2 font-mono">Drive-In Opens In: 02d 06h 31m 05s</p>
    </div>

    <!-- Active Motion Effect Canvas -->
    <canvas id="effectCanvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('effectCanvas');
    const ctx = canvas.getContext('2d');

    let currentMode = 'deluxe'; // 'cupid', 'petals', 'neon', 'deluxe'
    let animId = null;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 1. Cupid's Arrow Engine
    let cupidArrows = [];
    let cupidSparks = [];
    let lastArrowTime = 0;

    function spawnCupidArrow() {
      // Launch from upper left sky towards center-right sky
      cupidArrows.push({
        x: -50,
        y: Math.random() * (canvas.height * 0.25) + 60,
        vx: Math.random() * 4 + 7,
        vy: (Math.random() - 0.2) * 1.5,
        targetX: canvas.width * 0.72 + Math.random() * 100,
        trail: [],
        fizzled: false
      });
    }

    function burstCupidStardust(x, y) {
      const sparkCount = 38;
      for (let i = 0; i < sparkCount; i++) {
        const angle = (Math.PI * 2 / sparkCount) * i + (Math.random() - 0.5) * 0.4;
        const speed = Math.random() * 3.5 + 1.2;
        cupidSparks.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 0.5,
          alpha: 1,
          size: Math.random() * 3 + 2,
          isHeart: i % 3 === 0,
          color: i % 2 === 0 ? '#fbbf24' : '#f43f5e'
        });
      }
    }

    // 2. 3D Tumbling Rose Petals Engine
    let rosePetals = [];
    const PETAL_COUNT = 32;

    function initRosePetals() {
      rosePetals = [];
      for (let i = 0; i < PETAL_COUNT; i++) {
        rosePetals.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 12 + 10,
          speedY: Math.random() * 1.2 + 0.6,
          speedX: Math.random() * 1.5 + 0.5, // gentle rightward breeze
          rotX: Math.random() * Math.PI,
          rotY: Math.random() * Math.PI,
          rotZ: Math.random() * Math.PI,
          rotSpeedX: (Math.random() - 0.5) * 0.035,
          rotSpeedY: (Math.random() - 0.5) * 0.045,
          rotSpeedZ: (Math.random() - 0.5) * 0.025,
          swayPhase: Math.random() * Math.PI * 2,
          alpha: Math.random() * 0.4 + 0.6,
          shade: i % 3 // 0: crimson, 1: deep rose, 2: blush pink
        });
      }
    }

    // 3. Neon Heart Lanterns Engine
    let neonHearts = [];
    const NEON_COUNT = 24;

    function initNeonHearts() {
      neonHearts = [];
      for (let i = 0; i < NEON_COUNT; i++) {
        neonHearts.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 14 + 10,
          speedY: -(Math.random() * 0.8 + 0.4),
          speedX: (Math.random() - 0.5) * 0.5,
          pulse: Math.random() * Math.PI * 2,
          alpha: Math.random() * 0.5 + 0.4,
          glowColor: i % 2 === 0 ? '#f43f5e' : '#ec4899'
        });
      }
    }

    function drawHeartShape(c, x, y, size) {
      c.beginPath();
      const topCurveHeight = size * 0.3;
      c.moveTo(x, y + topCurveHeight);
      c.bezierCurveTo(x, y, x - size / 2, y, x - size / 2, y + topCurveHeight);
      c.bezierCurveTo(x - size / 2, y + (size + topCurveHeight) / 2, x, y + (size + topCurveHeight) / 2, x, y + size);
      c.bezierCurveTo(x, y + (size + topCurveHeight) / 2, x + size / 2, y + (size + topCurveHeight) / 2, x + size / 2, y + topCurveHeight);
      c.bezierCurveTo(x + size / 2, y, x, y, x, y + topCurveHeight);
      c.closePath();
    }

    // Main 60fps Animation Loop
    function loop(now) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const showCupid = currentMode === 'cupid' || currentMode === 'deluxe';
      const showPetals = currentMode === 'petals' || currentMode === 'deluxe';
      const showNeon = currentMode === 'neon' || currentMode === 'deluxe';

      // --- A. NEON HEART LANTERNS ---
      if (showNeon) {
        for (let i = 0; i < neonHearts.length; i++) {
          const nh = neonHearts[i];
          nh.y += nh.speedY;
          nh.x += nh.speedX;
          nh.pulse += 0.04;

          // Wrap edges
          if (nh.y < -30) { nh.y = canvas.height + 30; nh.x = Math.random() * canvas.width; }
          if (nh.x < -30) nh.x = canvas.width + 30;
          if (nh.x > canvas.width + 30) nh.x = -30;

          const currentPulse = Math.sin(nh.pulse) * 0.15 + 1;

          ctx.save();
          ctx.strokeStyle = nh.glowColor;
          ctx.shadowColor = nh.glowColor;
          ctx.shadowBlur = 12 * currentPulse;
          ctx.lineWidth = 2;
          ctx.globalAlpha = nh.alpha * (Math.sin(nh.pulse * 0.7) * 0.2 + 0.8);
          drawHeartShape(ctx, nh.x, nh.y, nh.size * currentPulse);
          ctx.stroke();

          // Soft inner glow
          ctx.fillStyle = nh.glowColor;
          ctx.globalAlpha = 0.08 * currentPulse;
          ctx.fill();
          ctx.restore();
        }
      }

      // --- B. 3D TUMBLING ROSE PETALS ---
      if (showPetals) {
        for (let i = 0; i < rosePetals.length; i++) {
          const p = rosePetals[i];
          p.swayPhase += 0.03;
          p.y += p.speedY;
          p.x += p.speedX + Math.sin(p.swayPhase) * 0.8;
          p.rotX += p.rotSpeedX;
          p.rotY += p.rotSpeedY;
          p.rotZ += p.rotSpeedZ;

          if (p.y > canvas.height + 25) { p.y = -25; p.x = Math.random() * canvas.width; }
          if (p.x > canvas.width + 25) p.x = -25;

          const scaleX = Math.cos(p.rotX);
          const scaleY = Math.sin(p.rotY);

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rotZ);
          ctx.scale(Math.max(0.2, Math.abs(scaleX)), Math.max(0.2, Math.abs(scaleY)));

          // Petal Color Gradients
          const grad = ctx.createRadialGradient(0, 0, 1, 0, 0, p.size);
          if (p.shade === 0) {
            grad.addColorStop(0, '#f43f5e');
            grad.addColorStop(0.7, '#be123c');
            grad.addColorStop(1, '#881337');
          } else if (p.shade === 1) {
            grad.addColorStop(0, '#fb7185');
            grad.addColorStop(0.7, '#e11d48');
            grad.addColorStop(1, '#9f1239');
          } else {
            grad.addColorStop(0, '#fda4af');
            grad.addColorStop(0.7, '#f43f5e');
            grad.addColorStop(1, '#be123c');
          }

          ctx.fillStyle = grad;
          ctx.globalAlpha = p.alpha;
          ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
          ctx.shadowBlur = 6;

          // Organic Curving Petal Shape
          ctx.beginPath();
          ctx.moveTo(0, -p.size * 0.9);
          ctx.bezierCurveTo(p.size * 0.7, -p.size * 0.6, p.size * 0.8, p.size * 0.6, 0, p.size * 0.9);
          ctx.bezierCurveTo(-p.size * 0.8, p.size * 0.6, -p.size * 0.7, -p.size * 0.6, 0, -p.size * 0.9);
          ctx.fill();

          ctx.restore();
        }
      }

      // --- C. CUPID'S GOLDEN STARDUST ARROW ---
      if (showCupid) {
        if (now - lastArrowTime > 6500) {
          spawnCupidArrow();
          lastArrowTime = now;
        }

        // Draw Arrows
        for (let i = cupidArrows.length - 1; i >= 0; i--) {
          const arr = cupidArrows[i];
          arr.x += arr.vx;
          arr.y += arr.vy;
          arr.trail.push({ x: arr.x, y: arr.y, alpha: 1 });

          // Render shimmering comet trail
          for (let t = arr.trail.length - 1; t >= 0; t--) {
            const tr = arr.trail[t];
            tr.alpha -= 0.035;
            if (tr.alpha <= 0) {
              arr.trail.splice(t, 1);
              continue;
            }
            ctx.save();
            ctx.beginPath();
            ctx.arc(tr.x, tr.y, (1 - tr.alpha) * 4 + 1.5, 0, Math.PI * 2);
            ctx.fillStyle = t % 2 === 0 ? '#fbbf24' : '#f43f5e';
            ctx.shadowColor = '#f59e0b';
            ctx.shadowBlur = 10;
            ctx.globalAlpha = tr.alpha * 0.8;
            ctx.fill();
            ctx.restore();
          }

          // Render Golden Arrow Head & Glowing Shaft
          ctx.save();
          ctx.translate(arr.x, arr.y);
          const angle = Math.atan2(arr.vy, arr.vx);
          ctx.rotate(angle);

          // Arrow Shaft
          ctx.beginPath();
          ctx.moveTo(-32, 0);
          ctx.lineTo(8, 0);
          ctx.strokeStyle = '#fef08a';
          ctx.lineWidth = 2.5;
          ctx.shadowColor = '#fbbf24';
          ctx.shadowBlur = 12;
          ctx.stroke();

          // Golden Heart Arrowhead
          ctx.fillStyle = '#f43f5e';
          ctx.strokeStyle = '#fbbf24';
          ctx.lineWidth = 1.5;
          ctx.shadowColor = '#fbbf24';
          ctx.shadowBlur = 14;
          drawHeartShape(ctx, 10, -5, 12);
          ctx.fill();
          ctx.stroke();

          // Feather Fletchings
          ctx.beginPath();
          ctx.moveTo(-32, 0);
          ctx.lineTo(-40, -6);
          ctx.moveTo(-32, 0);
          ctx.lineTo(-40, 6);
          ctx.strokeStyle = '#fbbf24';
          ctx.lineWidth = 2;
          ctx.stroke();

          ctx.restore();

          // Detonation into Heart Stardust
          if (arr.x >= arr.targetX) {
            burstCupidStardust(arr.x, arr.y);
            cupidArrows.splice(i, 1);
          }
        }

        // Draw Sparks
        for (let i = cupidSparks.length - 1; i >= 0; i--) {
          const s = cupidSparks[i];
          s.x += s.vx;
          s.y += s.vy;
          s.vy += 0.04; // gravity
          s.alpha -= 0.016;

          if (s.alpha <= 0) {
            cupidSparks.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.globalAlpha = s.alpha;
          ctx.fillStyle = s.color;
          ctx.shadowColor = s.color;
          ctx.shadowBlur = 8;

          if (s.isHeart) {
            drawHeartShape(ctx, s.x, s.y, s.size * 2);
            ctx.fill();
          } else {
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
      }

      animId = requestAnimationFrame(loop);
    }

    function switchMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.demo-pill').forEach(b => b.classList.remove('active'));

      if (mode === 'cupid') {
        document.getElementById('btnOpt1').classList.add('active');
        spawnCupidArrow();
      } else if (mode === 'petals') {
        document.getElementById('btnOpt2').classList.add('active');
      } else if (mode === 'neon') {
        document.getElementById('btnOpt3').classList.add('active');
      } else if (mode === 'deluxe') {
        document.getElementById('btnOpt4').classList.add('active');
        spawnCupidArrow();
      }
    }

    // Initialize & Start
    initRosePetals();
    initNeonHearts();
    spawnCupidArrow();
    animId = requestAnimationFrame(loop);
  </script>
</body>
</html>
