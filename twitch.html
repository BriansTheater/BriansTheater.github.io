<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎃 Brian's Haunted Theater • Twitch Stream Overlay (1080p)</title>
  <link rel="icon" type="image/png" href="icons/icon-192.png">

  <link rel="preconnect" href="https://brianstheater-default-rtdb.firebaseio.com" crossorigin>
  <link rel="dns-prefetch" href="https://brianstheater-default-rtdb.firebaseio.com">
  <link rel="preconnect" href="https://image.tmdb.org" crossorigin>
  <link rel="dns-prefetch" href="https://image.tmdb.org">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@700;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
            cinzel: ['Cinzel', 'serif']
          }
        }
      }
    };
  </script>

  <style>
    /* Reset & Viewport containment for 1080p Stream */
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 28%, #160a29 0%, #0b0517 45%, #030207 100%);
      color: #e2e8f0;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Ambient fog drift across bottom */
    @keyframes fogRoll {
      0% { transform: translateX(-12%); opacity: 0.28; }
      50% { transform: translateX(8%); opacity: 0.55; }
      100% { transform: translateX(-12%); opacity: 0.28; }
    }
    .fog-layer {
      animation: fogRoll 20s ease-in-out infinite;
    }

    /* Subtle eerie candle flicker for the title */
    @keyframes eerieCandleFlicker {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(249, 115, 22, 0.45)) drop-shadow(0 0 20px rgba(168, 85, 247, 0.25)); }
      30% { filter: drop-shadow(0 0 16px rgba(249, 115, 22, 0.75)) drop-shadow(0 0 32px rgba(168, 85, 247, 0.55)); }
      60% { filter: drop-shadow(0 0 8px rgba(249, 115, 22, 0.35)) drop-shadow(0 0 14px rgba(168, 85, 247, 0.15)); }
      85% { filter: drop-shadow(0 0 14px rgba(249, 115, 22, 0.65)) drop-shadow(0 0 25px rgba(168, 85, 247, 0.35)); }
    }
    .anim-flicker { animation: eerieCandleFlicker 4s ease-in-out infinite; }

    /* Center Ambient Backlight Aura */
    .hero-glow-aura {
      position: absolute;
      inset: -15px;
      background: radial-gradient(ellipse at center, rgba(245, 158, 11, 0.22) 0%, rgba(168, 85, 247, 0.15) 50%, transparent 75%);
      filter: blur(32px);
      z-index: 0;
      pointer-events: none;
    }

    /* Gothic Proscenium Arch Pillars on the sides */
    .gothic-flank-left {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 140px;
      background: linear-gradient(90deg, rgba(2, 1, 6, 0.95) 0%, rgba(13, 6, 25, 0.75) 50%, transparent 100%);
      border-right: 1px solid rgba(168, 85, 247, 0.12);
      box-shadow: inset -15px 0 25px rgba(168, 85, 247, 0.08);
      pointer-events: none;
      z-index: 10;
    }
    .gothic-flank-right {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 140px;
      background: linear-gradient(-90deg, rgba(2, 1, 6, 0.95) 0%, rgba(13, 6, 25, 0.75) 50%, transparent 100%);
      border-left: 1px solid rgba(168, 85, 247, 0.12);
      box-shadow: inset 15px 0 25px rgba(168, 85, 247, 0.08);
      pointer-events: none;
      z-index: 10;
    }

    /* Diagonal Atmospheric Spotlights */
    .spotlight-left {
      position: absolute;
      top: -20px;
      left: 10%;
      width: 320px;
      height: 700px;
      background: linear-gradient(145deg, rgba(168, 85, 247, 0.08) 0%, rgba(245, 158, 11, 0.03) 40%, transparent 70%);
      filter: blur(28px);
      transform: rotate(18deg);
      pointer-events: none;
      z-index: 1;
    }
    .spotlight-right {
      position: absolute;
      top: -20px;
      right: 10%;
      width: 320px;
      height: 700px;
      background: linear-gradient(-145deg, rgba(245, 158, 11, 0.08) 0%, rgba(168, 85, 247, 0.03) 40%, transparent 70%);
      filter: blur(28px);
      transform: rotate(-18deg);
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body class="w-full h-full relative flex items-center justify-center">

  <!-- ========================================== -->
  <!-- 1. CREEPY ATMOSPHERIC BACKGROUND (NO ICONS)-->
  <!-- ========================================== -->

  <!-- Diagonal Theatrical Light Beams -->
  <div class="spotlight-left"></div>
  <div class="spotlight-right"></div>

  <!-- Left & Right Gothic Proscenium Flanks -->
  <div class="gothic-flank-left"></div>
  <div class="gothic-flank-right"></div>

  <!-- Ambient Rolling Ground Mist -->
  <div class="absolute bottom-0 left-0 right-0 h-32 pointer-events-none z-10 overflow-hidden opacity-50">
    <div class="w-[140%] h-full bg-gradient-to-t from-purple-950/80 via-slate-900/30 to-transparent fog-layer"></div>
  </div>


  <!-- ========================================== -->
  <!-- 2. CENTER STAGE: THE LIVE BILLBOARD (1080p)-->
  <!-- ========================================== -->
  <main class="relative z-20 w-full max-w-4xl mx-auto px-4 py-3 flex flex-col items-center justify-center text-center">

    <!-- A. TOP THEATER BRANDING TITLE -->
    <header class="mb-2 sm:mb-3">
      <div class="inline-flex items-center gap-3 px-4 py-2 rounded-2xl bg-slate-950/90 border border-orange-500/40 shadow-[0_0_25px_rgba(249,115,22,0.25)] backdrop-blur-md">
        <div class="w-9 h-9 sm:w-11 sm:h-11 rounded-xl bg-gradient-to-tr from-orange-500 via-amber-400 to-purple-600 p-0.5 shadow-lg shadow-orange-950/60 flex items-center justify-center text-slate-950 font-black text-lg sm:text-2xl shrink-0">
          <span>🎃</span>
        </div>
        <div class="flex flex-col text-left">
          <div class="flex items-center gap-1.5">
            <h1 class="text-sm sm:text-lg md:text-xl font-black tracking-wider uppercase text-transparent bg-clip-text bg-gradient-to-r from-orange-400 via-amber-300 to-purple-400 leading-tight anim-flicker">
              Brian's Haunted Theater
            </h1>
          </div>
          <span class="text-[9px] sm:text-[10px] text-orange-300/90 font-mono tracking-wider uppercase font-semibold">
            Shocktoberfest Edition
          </span>
        </div>
      </div>
    </header>

    <!-- B. SCREENING STATUS & MOVIE TITLE -->
    <section class="flex flex-col items-center gap-1 mb-2.5 sm:mb-3">
      <span id="screeningStatusBadge" class="text-[11px] sm:text-xs font-mono font-bold tracking-[0.26em] text-amber-400 uppercase">
        NEXT SCHEDULED SCREENING
      </span>

      <h2 id="movieTitle" class="text-3xl sm:text-5xl md:text-6xl font-black tracking-tight flex items-center justify-center gap-2 text-transparent bg-clip-text bg-gradient-to-r from-orange-500 via-amber-300 to-purple-400 filter drop-shadow-[0_0_20px_rgba(249,115,22,0.6)]">
        <span id="movieTitleText">Hokum</span>
      </h2>

      <p id="movieShowtime" class="text-xs sm:text-sm md:text-base text-slate-300 font-medium tracking-wide">
        Friday, Oct 16, 2026 • 7:00 PM PST
      </p>
    </section>

    <!-- C. CENTER HERO POSTER FRAME (16:9 Glowing Widescreen) -->
    <section class="relative w-full max-w-2xl sm:max-w-3xl mb-3 sm:mb-4 flex items-center justify-center">
      <!-- Glow Aura -->
      <div class="hero-glow-aura"></div>

      <!-- Poster Frame -->
      <div id="posterFrame" class="relative z-10 w-full overflow-hidden rounded-2xl sm:rounded-3xl border border-amber-500/50 bg-slate-950/95 shadow-[0_0_40px_rgba(245,158,11,0.35)] aspect-[16/9] max-h-[42vh] flex items-center justify-center">
        <img
          id="heroPosterImg"
          src="https://image.tmdb.org/t/p/w1280/qY7zVZ7liULhfRoXg4c9Xl83LcR.jpg"
          alt="Featured Movie Screening"
          class="w-full h-full object-cover object-center transition-opacity duration-700"
          onerror="handlePosterError(this)"
        />
      </div>
    </section>

    <!-- D. DIGITAL COUNTDOWN CARD CONTAINER -->
    <section id="countdownContainer" class="w-full max-w-xl">
      <div id="countdownBox" class="w-full bg-slate-950/90 backdrop-blur-md rounded-2xl sm:rounded-3xl p-4 sm:p-5 border border-amber-500/40 shadow-[0_0_30px_rgba(245,158,11,0.25)] flex flex-col items-center gap-3">
        
        <!-- Header Label -->
        <div id="countdownHeader" class="text-xs sm:text-sm font-mono font-bold tracking-[0.25em] text-amber-300 uppercase flex items-center justify-center gap-2">
          <span id="countdownHeaderText">THEATER DOORS OPEN IN</span>
        </div>

        <!-- Digits Grid -->
        <div id="countdownGrid" class="grid grid-cols-3 gap-2.5 sm:gap-3.5 w-full font-mono">
          
          <!-- Optional Days Column -->
          <div id="colDays" class="hidden flex flex-col items-center justify-center bg-slate-900/90 border border-amber-500/30 rounded-xl p-2 sm:p-2.5 shadow-md">
            <span id="countDays" class="text-2xl sm:text-4xl font-black text-amber-400 tracking-tight leading-none">00</span>
            <span class="text-[9px] sm:text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">DAYS</span>
          </div>

          <!-- Hours Column -->
          <div class="flex flex-col items-center justify-center bg-slate-900/90 border border-amber-500/30 rounded-xl p-2 sm:p-2.5 shadow-md">
            <span id="countHours" class="text-2xl sm:text-4xl font-black text-amber-400 tracking-tight leading-none">00</span>
            <span class="text-[9px] sm:text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">HOURS</span>
          </div>

          <!-- Minutes Column -->
          <div class="flex flex-col items-center justify-center bg-slate-900/90 border border-amber-500/30 rounded-xl p-2 sm:p-2.5 shadow-md">
            <span id="countMins" class="text-2xl sm:text-4xl font-black text-amber-400 tracking-tight leading-none">00</span>
            <span class="text-[9px] sm:text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">MINS</span>
          </div>

          <!-- Seconds Column -->
          <div class="flex flex-col items-center justify-center bg-slate-900/90 border border-amber-500/30 rounded-xl p-2 sm:p-2.5 shadow-md">
            <span id="countSecs" class="text-2xl sm:text-4xl font-black text-amber-300 tracking-tight leading-none">00</span>
            <span class="text-[9px] sm:text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">SECS</span>
          </div>

        </div>

        <!-- Enter Theater Action Button (Activated when Doors Open) -->
        <div id="doorsOpenActions" class="hidden w-full pt-1">
          <a
            href="index.html"
            target="_blank"
            class="w-full py-3 px-6 rounded-xl bg-gradient-to-r from-amber-500 via-orange-500 to-purple-600 hover:from-amber-400 hover:to-purple-500 text-slate-950 font-black text-sm sm:text-base uppercase tracking-wider shadow-lg shadow-amber-500/30 transition-all flex items-center justify-center gap-2 group cursor-pointer"
          >
            <span>ENTER THEATER NOW</span>
            <span class="group-hover:translate-x-1 transition-transform">→</span>
          </a>
        </div>

      </div>
    </section>

    <!-- Bottom Real-Time Sync Status indicator -->
    <footer class="mt-2 flex items-center gap-3 text-[10px] font-mono text-slate-500">
      <div id="syncStatus" class="flex items-center gap-1.5">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
        <span>Firebase RTDB Synced</span>
      </div>
      <span>•</span>
      <a href="live.html" class="hover:text-amber-400 transition underline">Standalone Billboard</a>
      <span>•</span>
      <a href="halloween-icons.html" class="hover:text-orange-400 transition underline">Icons Showcase</a>
    </footer>

  </main>


  <!-- ========================================== -->
  <!-- 3. REALTIME JAVASCRIPT LOGIC               -->
  <!-- ========================================== -->
  <script>
    const FIREBASE_RTDB_URL = "https://brianstheater-default-rtdb.firebaseio.com/theaterSync.json";
    let eventSource = null;

    // Active state model
    let activeMovie = {
      title: "Hokum",
      startMs: Date.now() + (2 * 3600 * 1000) + (45 * 60 * 1000), // Default 2h 45m from now
      endMs: Date.now() + (4 * 3600 * 1000),
      posterUrl: "https://image.tmdb.org/t/p/w1280/qY7zVZ7liULhfRoXg4c9Xl83LcR.jpg",
      showtimeText: "Tonight • 7:00 PM PST",
      isNowPlaying: false,
      doorMode: "auto"
    };

    // 1. Digital Countdown Clock Loop
    function updateCountdown() {
      const now = Date.now();
      const diffMs = activeMovie.startMs - now;

      const countdownHeader = document.getElementById('countdownHeaderText');
      const doorsOpenBadge = document.getElementById('doorsOpenBadge');
      const doorsOpenActions = document.getElementById('doorsOpenActions');
      const countdownGrid = document.getElementById('countdownGrid');
      const screeningSubtitle = document.getElementById('screeningStatusBadge');

      if (activeMovie.doorMode === 'open' || diffMs <= 0) {
        // Doors Open / Live Screen state
        if (countdownHeader) countdownHeader.textContent = "THEATER DOORS ARE OPEN!";
        if (doorsOpenBadge) doorsOpenBadge.classList.remove('hidden');
        if (doorsOpenActions) doorsOpenActions.classList.remove('hidden');
        if (countdownGrid) countdownGrid.classList.add('hidden');
        if (screeningSubtitle) {
          screeningSubtitle.textContent = "NOW SCREENING IN THEATER";
          screeningSubtitle.className = "text-[11px] sm:text-xs font-mono font-bold tracking-[0.26em] text-emerald-400 uppercase";
        }
        return;
      }

      // Doors Closed Countdown State
      if (doorsOpenBadge) doorsOpenBadge.classList.add('hidden');
      if (doorsOpenActions) doorsOpenActions.classList.add('hidden');
      if (countdownGrid) countdownGrid.classList.remove('hidden');
      if (screeningSubtitle) {
        screeningSubtitle.textContent = "NEXT SCHEDULED SCREENING";
        screeningSubtitle.className = "text-[11px] sm:text-xs font-mono font-bold tracking-[0.26em] text-amber-400 uppercase";
      }
      if (countdownHeader) countdownHeader.textContent = "THEATER DOORS OPEN IN";

      const totalSeconds = Math.max(0, Math.floor(diffMs / 1000));
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const mins = Math.floor((totalSeconds % 3600) / 60);
      const secs = totalSeconds % 60;

      const colDays = document.getElementById('colDays');
      const countDays = document.getElementById('countDays');
      const countHours = document.getElementById('countHours');
      const countMins = document.getElementById('countMins');
      const countSecs = document.getElementById('countSecs');

      if (days > 0) {
        if (colDays) colDays.classList.remove('hidden');
        if (countDays) countDays.textContent = String(days).padStart(2, '0');
        if (countdownGrid) countdownGrid.className = 'grid grid-cols-4 gap-2.5 sm:gap-3.5 w-full font-mono';
      } else {
        if (colDays) colDays.classList.add('hidden');
        if (countdownGrid) countdownGrid.className = 'grid grid-cols-3 gap-2.5 sm:gap-3.5 w-full font-mono';
      }

      if (countHours) countHours.textContent = String(hours).padStart(2, '0');
      if (countMins) countMins.textContent = String(mins).padStart(2, '0');
      if (countSecs) countSecs.textContent = String(secs).padStart(2, '0');
    }

    // 2. Format localized screening time string
    function formatShowtime(startMs, dateStr, timeStr) {
      if (startMs) {
        try {
          const d = new Date(startMs);
          const datePart = d.toLocaleDateString('en-US', {
            weekday: 'long',
            month: 'short',
            day: 'numeric',
            year: 'numeric',
            timeZone: 'America/Los_Angeles'
          });
          const timePart = d.toLocaleTimeString('en-US', {
            hour: 'numeric',
            minute: '2-digit',
            timeZone: 'America/Los_Angeles'
          });
          return `${datePart} • ${timePart} PST`;
        } catch(e) {}
      }
      if (dateStr && timeStr) return `${dateStr} • ${timeStr} PST`;
      return 'Tonight • 7:00 PM PST';
    }

    // 3. Fallback poster image handler
    function handlePosterError(imgEl) {
      if (!imgEl.dataset.failed) {
        imgEl.dataset.failed = "true";
        imgEl.src = "https://image.tmdb.org/t/p/w780/x6rHcQFiYcczLQPrmxXPAicm54E.jpg";
      }
    }

    // 4. Update DOM with active movie state
    function renderMovieState() {
      const titleEl = document.getElementById('movieTitleText');
      const showtimeEl = document.getElementById('movieShowtime');
      const posterEl = document.getElementById('heroPosterImg');

      if (titleEl) titleEl.textContent = (activeMovie.title || 'Coming Soon').replace(/^🎬\s*/, '').trim();
      if (showtimeEl) showtimeEl.textContent = activeMovie.showtimeText;
      if (posterEl && activeMovie.posterUrl) {
        if (posterEl.src !== activeMovie.posterUrl) {
          posterEl.style.opacity = '0.3';
          setTimeout(() => {
            posterEl.src = activeMovie.posterUrl;
            posterEl.onload = () => { posterEl.style.opacity = '1'; };
          }, 150);
        }
      }
      updateCountdown();
    }

    // 5. Parse and apply incoming Firebase Data
    function applySyncPayload(data) {
      if (!data) return;

      let foundNext = null;
      let foundNow = null;

      if (data.doorMode) activeMovie.doorMode = data.doorMode;

      if (data.cinema) {
        if (data.cinema.nowPlaying && data.cinema.nowPlaying !== 'No Movie Playing') {
          foundNow = {
            title: data.cinema.nowPlaying,
            posterUrl: data.cinema.nowPlayingPoster,
            endMs: data.cinema.endMs
          };
        }
        if (data.cinema.nextTitle && data.cinema.nextTitle !== 'No Movie Scheduled') {
          foundNext = {
            title: data.cinema.nextTitle,
            startMs: data.cinema.nextStartMs,
            posterUrl: data.cinema.nextPoster
          };
        }
        if (Array.isArray(data.cinema.schedule) && data.cinema.schedule.length > 0) {
          const nextSched = data.cinema.schedule.find(s => s.status === 'NEXT UP' || s.startMs > Date.now());
          if (nextSched) {
            foundNext = {
              title: nextSched.title,
              startMs: nextSched.startMs,
              endMs: nextSched.endMs,
              date: nextSched.date,
              time: nextSched.startTime || nextSched.time,
              posterUrl: nextSched.posterUrl || nextSched.imageUrl
            };
          }
        }
      }

      if (!foundNext && Array.isArray(data.officialSchedule)) {
        const nextSched = data.officialSchedule.find(s => s && (s.startMs > Date.now() || s.status === 'NEXT UP'));
        if (nextSched) {
          foundNext = {
            title: nextSched.title,
            startMs: nextSched.startMs,
            endMs: nextSched.endMs,
            date: nextSched.date,
            time: nextSched.startTime || nextSched.time,
            posterUrl: nextSched.posterUrl || nextSched.imageUrl
          };
        }
      }

      const target = foundNow || foundNext;
      if (target) {
        activeMovie.title = target.title.replace(/^🎬\s*/, '').trim();
        if (target.startMs) activeMovie.startMs = target.startMs;
        if (target.endMs) activeMovie.endMs = target.endMs;
        activeMovie.isNowPlaying = Boolean(foundNow);
        activeMovie.showtimeText = formatShowtime(target.startMs, target.date, target.time);

        let resolvedPoster = target.posterUrl;
        if (!resolvedPoster && data.moviePosters && data.moviePosters[activeMovie.title]) {
          const p = data.moviePosters[activeMovie.title];
          resolvedPoster = (typeof p === 'object') ? (p.backdropUrl || p.posterUrl) : p;
        }
        if (resolvedPoster) activeMovie.posterUrl = resolvedPoster;

        renderMovieState();
      }
    }

    // 6. Connect to Realtime Firebase SSE Feed
    function initRealtimeSync() {
      const syncStatus = document.getElementById('syncStatus');

      fetch(FIREBASE_RTDB_URL)
        .then(res => res.json())
        .then(data => {
          applySyncPayload(data);
          if (syncStatus) {
            syncStatus.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span><span>Firebase RTDB Synced</span>';
          }
        })
        .catch(err => {
          console.warn('Initial Firebase fetch error:', err);
        });

      try {
        if (eventSource) eventSource.close();
        eventSource = new EventSource(FIREBASE_RTDB_URL);

        eventSource.addEventListener('put', (event) => {
          try {
            const payload = JSON.parse(event.data);
            if (payload && payload.data) applySyncPayload(payload.data);
          } catch(e) {}
        });

        eventSource.addEventListener('patch', (event) => {
          try {
            const payload = JSON.parse(event.data);
            if (payload && payload.data) applySyncPayload(payload.data);
          } catch(e) {}
        });

        eventSource.onerror = () => {
          if (syncStatus) {
            syncStatus.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span><span>Reconnecting Sync...</span>';
          }
        };

        eventSource.onopen = () => {
          if (syncStatus) {
            syncStatus.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span><span>Firebase RTDB Synced</span>';
          }
        };
      } catch(err) {
        console.warn('SSE Error:', err);
      }
    }

    // Initialize on page load
    window.addEventListener('DOMContentLoaded', () => {
      renderMovieState();
      setInterval(updateCountdown, 1000);
      initRealtimeSync();
    });
  </script>
</body>
</html>
