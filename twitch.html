      margin: 0;
      padding: 0;

      color: #e2e8f0;

      -webkit-user-select: none;

    /* Ambient fog drift across bottom */

      50% { transform: translateX(8%); opacity: 0.55; }
      100% { transform: translateX(-12%); opacity: 0.28; }

    .gothic-flank-right {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 140px;

      height: 700px;

    // 1. Digital Countdown Clock Loop (Synchronized with main theater doors opening)
    function updateCountdown() {
      const now = Date.now();
      const startMs = Number(activeMovie.startMs) || 0;
      const endMs = Number(activeMovie.endMs) || (startMs ? startMs + (105 * 60 * 1000) : 0);

      // Doors open 10 minutes (600,000ms) prior to screening time
      const doorsOpenMs = startMs - 600000;
      const diffDoors = Math.max(0, doorsOpenMs - now);
      const isWithin10Mins = (diffDoors <= 0 && now < startMs);
      const isLiveScreening = (startMs > 0 && now >= startMs && (!endMs || now < endMs));

      const countdownHeader = document.getElementById('countdownHeaderText');
      const doorsOpenBadge = document.getElementById('doorsOpenBadge');
      const doorsOpenActions = document.getElementById('doorsOpenActions');
      const countdownGrid = document.getElementById('countdownGrid');
      const screeningSubtitle = document.getElementById('screeningStatusBadge');

      const isForcedOpen = (activeMovie.doorMode === 'force_open' || activeMovie.doorMode === 'open');
      const isForcedClosed = (activeMovie.doorMode === 'force_closed');
      const areDoorsOpen = isForcedOpen || (!isForcedClosed && (isWithin10Mins || isLiveScreening));

      const heroPoster = document.getElementById('heroPosterImg');
      const heroTrailer = document.getElementById('heroTrailerContainer');
      const heroTrailerFrame = document.getElementById('heroTrailerFrame');

      if (areDoorsOpen) {
        // Doors Open / Live Screen state
        if (countdownHeader) {
          countdownHeader.textContent = isLiveScreening ? "LIVE SCREENING IN PROGRESS!" : "THEATER DOORS ARE OPEN!";
        }
        if (doorsOpenBadge) doorsOpenBadge.classList.remove('hidden');
        if (doorsOpenActions) doorsOpenActions.classList.remove('hidden');
        if (countdownGrid) countdownGrid.classList.add('hidden');
        if (screeningSubtitle) {
          screeningSubtitle.textContent = isLiveScreening ? "NOW SCREENING IN THEATER" : "DOORS OPEN • SEATING NOW";
          screeningSubtitle.className = "text-[11px] sm:text-xs font-mono font-bold tracking-[0.26em] text-emerald-400 uppercase";
        }

        // Live Cinema Trailer Replay in place of Poster
        const trailerId = activeMovie.trailerId || getTrailerIdForTitle(activeMovie.title, lastKnownPayload.movieTrailers);
        if (trailerId && heroTrailer && heroTrailerFrame) {
          heroTrailer.classList.remove('hidden');
          if (heroPoster) heroPoster.classList.add('hidden');
          const desiredSrc = `https://www.youtube-nocookie.com/embed/${encodeURIComponent(trailerId)}?autoplay=1&mute=1&loop=1&playlist=${encodeURIComponent(trailerId)}&rel=0&modestbranding=1&controls=1`;
          if (heroTrailerFrame.src !== desiredSrc) {
            heroTrailerFrame.src = desiredSrc;
          }
        }
        return;
      }

      // Revert trailer back to poster when doors closed
      if (heroTrailer && !heroTrailer.classList.contains('hidden')) {
        heroTrailer.classList.add('hidden');
        if (heroTrailerFrame) heroTrailerFrame.src = "";
      }
      if (heroPoster && heroPoster.classList.contains('hidden')) {
        heroPoster.classList.remove('hidden');
      }

      // Doors Closed Countdown State
      if (doorsOpenBadge) doorsOpenBadge.classList.add('hidden');
      if (doorsOpenActions) doorsOpenActions.classList.add('hidden');
      if (countdownGrid) countdownGrid.classList.remove('hidden');
      if (screeningSubtitle) {
        screeningSubtitle.textContent = "NEXT SCHEDULED SCREENING";
        screeningSubtitle.className = "text-[11px] sm:text-xs font-mono font-bold tracking-[0.26em] text-purple-300/90 uppercase";
      }
      if (countdownHeader) countdownHeader.textContent = "THEATER DOORS OPEN IN";

      // Target countdown to doors opening (10 min before show)
      const totalSeconds = Math.max(0, Math.floor(diffDoors / 1000));
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const mins = Math.floor((totalSeconds % 3600) / 60);
      const secs = totalSeconds % 60;

      const colDays = document.getElementById('colDays');
      const colHours = document.getElementById('colHours');
      const colMins = document.getElementById('colMins');
      const colSecs = document.getElementById('colSecs');

      const countDays = document.getElementById('countDays');
      const countHours = document.getElementById('countHours');
      const countMins = document.getElementById('countMins');
      const countSecs = document.getElementById('countSecs');

      if (countDays) countDays.textContent = String(days).padStart(2, '0');
      if (countHours) countHours.textContent = String(hours).padStart(2, '0');
      if (countMins) countMins.textContent = String(mins).padStart(2, '0');
      if (countSecs) countSecs.textContent = String(secs).padStart(2, '0');

      // Dynamic unit box hiding: omit 0 Days, 0 Hours, and 0 Mins
      if (days > 0) {
        if (colDays) colDays.classList.remove('hidden');
        if (colHours) colHours.classList.remove('hidden');
        if (colMins) colMins.classList.remove('hidden');
        if (colSecs) colSecs.classList.remove('hidden');
        if (countdownGrid) countdownGrid.className = 'grid grid-cols-4 gap-2.5 sm:gap-3.5 w-full font-mono';
      } else if (hours > 0) {
        if (colDays) colDays.classList.add('hidden');
        if (colHours) colHours.classList.remove('hidden');
        if (colMins) colMins.classList.remove('hidden');
        if (colSecs) colSecs.classList.remove('hidden');
        if (countdownGrid) countdownGrid.className = 'grid grid-cols-3 max-w-md mx-auto gap-2.5 sm:gap-3.5 w-full font-mono';
      } else if (mins > 0) {
        if (colDays) colDays.classList.add('hidden');
        if (colHours) colHours.classList.add('hidden');
        if (colMins) colMins.classList.remove('hidden');
        if (colSecs) colSecs.classList.remove('hidden');
        if (countdownGrid) countdownGrid.className = 'grid grid-cols-2 max-w-xs mx-auto gap-2.5 sm:gap-3.5 w-full font-mono';
      } else {
        // Only seconds remaining (<60s)
        if (colDays) colDays.classList.add('hidden');
        if (colHours) colHours.classList.add('hidden');
        if (colMins) colMins.classList.add('hidden');
        if (colSecs) colSecs.classList.remove('hidden');
        if (countdownGrid) countdownGrid.className = 'grid grid-cols-1 max-w-[140px] mx-auto gap-2.5 sm:gap-3.5 w-full font-mono';
      }
    }

    // 2. Format localized screening time string (Matches main stage exactly)
    function formatShowtime(startMs, dateStr, timeStr) {
      if (startMs) {
        try {
          const d = new Date(startMs);
          const datePart = d.toLocaleDateString('en-US', {
            weekday: 'long',
            month: 'short',
            day: 'numeric',
            year: 'numeric',
            timeZone: 'America/Los_Angeles'
          });
          const timePart = d.toLocaleTimeString('en-US', {
            hour: 'numeric',
            minute: '2-digit',
            timeZone: 'America/Los_Angeles'
          });
          return `${datePart} • ${timePart} PST`;
        } catch(e) {}
      }
      if (dateStr && timeStr) return `${dateStr} • ${timeStr} PST`;
      return dateStr || 'Saturday, Oct 17, 2026 • 7:00 PM PST';
    }

    function renderMovieState() {

    // 5. Parse and apply incoming Firebase Data
    function applySyncPayload(data) {
      if (!data) return;
      Object.assign(lastKnownPayload, data);
      const merged = lastKnownPayload;

      const now = Date.now();
      if (merged.doorMode) activeMovie.doorMode = merged.doorMode;

      let foundNow = null;
      let foundNext = null;

      // 1. Check if cinema.nowPlaying is actively screening right now
      if (merged.cinema && merged.cinema.nowPlaying && merged.cinema.nowPlaying !== 'No Movie Playing') {
        const endMs = Number(merged.cinema.endMs) || 0;
        const startMs = Number(merged.cinema.startMs) || (endMs ? endMs - (105 * 60 * 1000) : 0);
        const isNotConcluded = !isMovieConcluded({ endMs, startMs }, now);
        const isTimeMatch = (endMs > 0 && now < endMs) || (startMs > 0 && now >= startMs && now < startMs + (4 * 3600000));
        const isForcedLive = (merged.doorMode === 'force_open' || merged.doorMode === 'open');

        if (isNotConcluded && (isTimeMatch || isForcedLive)) {
          foundNow = {
            title: merged.cinema.nowPlaying,
            startMs: startMs || (now - 600000),
            endMs: endMs || (now + 3600000),
            posterUrl: merged.cinema.nowPlayingPoster || getMovieArtworkUrl(merged.cinema.nowPlaying, merged.moviePosters)
          };
        }
      }

      // 2. Gather all schedule entries
      const allSchedules = [];
      if (Array.isArray(merged.schedule)) allSchedules.push(...merged.schedule);
      if (Array.isArray(merged.officialSchedule)) allSchedules.push(...merged.officialSchedule);
      if (Array.isArray(merged.cinema && merged.cinema.schedule)) allSchedules.push(...merged.cinema.schedule);

      // Check if any schedule entry is actively screening right now
      if (!foundNow) {
        const liveEntry = allSchedules.find(s => {
          if (!s || !s.title) return false;
          if (isMovieConcluded(s, now)) return false;
          const sStart = Number(s.startMs) || 0;
          const sEnd = Number(s.endMs) || (sStart ? sStart + (105 * 60 * 1000) : 0);
          return (sStart > 0 && sEnd > 0 && now >= sStart && now < sEnd);
        });
        if (liveEntry) {
          foundNow = {
            title: liveEntry.title,
            startMs: Number(liveEntry.startMs),
            endMs: Number(liveEntry.endMs),
            date: liveEntry.date,
            time: liveEntry.startTime || liveEntry.time,
            posterUrl: liveEntry.posterUrl || liveEntry.imageUrl || getMovieArtworkUrl(liveEntry.title, merged.moviePosters)
          };
        }
      }

      // 3. If not actively live, search upcoming schedules sorted by startMs

      const upcoming = allSchedules.filter(s => {
        if (!s || !s.title) return false;
        if (isMovieConcluded(s, now)) return false;
        const sEnd = Number(s.endMs) || 0;
        const sStart = Number(s.startMs) || 0;
        return (sEnd > now || sStart > now);
      }).sort((a, b) => (Number(a.startMs) || 0) - (Number(b.startMs) || 0));

      if (upcoming.length > 0) {
        const next = upcoming[0];
        foundNext = {
          title: next.title,
          startMs: Number(next.startMs),
          endMs: Number(next.endMs),
          date: next.date,
          time: next.startTime || next.time,
          posterUrl: next.posterUrl || next.imageUrl || getMovieArtworkUrl(next.title, merged.moviePosters)
        };
      } else if (merged.cinema && merged.cinema.nextTitle && merged.cinema.nextTitle !== 'No Movie Scheduled') {
        const nextStart = Number(merged.cinema.nextStartMs) || 0;
        if (nextStart > now) {
          foundNext = {
            title: merged.cinema.nextTitle,
            startMs: nextStart,
            posterUrl: merged.cinema.nextPoster || getMovieArtworkUrl(merged.cinema.nextTitle, merged.moviePosters)
          };
        }
      }

      const target = foundNow || foundNext;
      if (target) {
        activeMovie.title = target.title.replace(/^🎬\s*/, '').trim();
        if (target.startMs) activeMovie.startMs = target.startMs;
        if (target.endMs) activeMovie.endMs = target.endMs;
        activeMovie.isNowPlaying = Boolean(foundNow);
        activeMovie.showtimeText = formatShowtime(target.startMs, target.date, target.time);

        let resolvedPoster = target.posterUrl || getMovieArtworkUrl(activeMovie.title, merged.moviePosters);
        if (resolvedPoster) activeMovie.posterUrl = resolvedPoster;

        renderMovieState();
      }
    }

    // Apply instantaneous state broadcast from main theater page
    function applyStageBroadcast(payload) {
      if (!payload) return;
      if (payload.title) activeMovie.title = payload.title.replace(/^🎬\s*/, '').trim();
      if (payload.date) activeMovie.showtimeText = payload.date;
      if (payload.poster) activeMovie.posterUrl = payload.poster;
      if (payload.startMs || payload.targetMs) activeMovie.startMs = payload.startMs || payload.targetMs;
      if (payload.doorMode) activeMovie.doorMode = payload.doorMode;
      renderMovieState();
    }

    // 6. Connect to Realtime Firebase SSE Feed & Broadcast Channel
    function initRealtimeSync() {
      // Shared Broadcast Channel for instant zero-latency cross-tab sync
      try {
        if (typeof BroadcastChannel !== 'undefined') {
          const syncChannel = new BroadcastChannel('brian_theater_sync');
          syncChannel.onmessage = (event) => {
            if (event.data) {
              if (event.data.type === 'stage_update' && event.data.payload) {
                applyStageBroadcast(event.data.payload);
              } else if (event.data.type === 'spotify_update' && event.data.payload) {
                setSpotifyPlaylist(event.data.payload.resource, event.data.payload.name);
              } else if (event.data.firebasePayload) {
                applySyncPayload(event.data.firebasePayload);
              }
            }
          };
        }
      } catch(e) {}

      // Initial HTTP Snapshot from Firebase RTDB
      fetch(FIREBASE_RTDB_URL)
        .then(res => res.json())
        .then(data => {
          applySyncPayload(data);
          if (data && data.spotifyPlaylist) {
            setSpotifyPlaylist(data.spotifyPlaylist.resource, data.spotifyPlaylist.name);
          }
        })
        .catch(err => {
          console.warn('Initial Firebase fetch error:', err);
        });

      // Persistent Real-Time SSE Stream
      try {
        if (eventSource) eventSource.close();
        eventSource = new EventSource(FIREBASE_RTDB_URL);

        eventSource.addEventListener('put', (event) => {
          try {
            const payload = JSON.parse(event.data);
            if (payload) {
              if (payload.path === '/' && payload.data) {
                applySyncPayload(payload.data);
                if (payload.data.spotifyPlaylist) setSpotifyPlaylist(payload.data.spotifyPlaylist.resource, payload.data.spotifyPlaylist.name);
              } else if (payload.path === '/spotifyPlaylist' && payload.data) {
                setSpotifyPlaylist(payload.data.resource, payload.data.name);
              } else if (payload.path === '/cinema' && payload.data) {
                applySyncPayload({ cinema: payload.data });
              } else if (payload.path === '/doorMode' && payload.data) {
                applySyncPayload({ doorMode: payload.data });
              } else if (payload.path === '/schedule' && payload.data) {
                applySyncPayload({ schedule: payload.data });
              } else if (payload.path === '/officialSchedule' && payload.data) {
                applySyncPayload({ officialSchedule: payload.data });
              } else if (payload.path === '/moviePosters' && payload.data) {
                applySyncPayload({ moviePosters: payload.data });
              } else if (payload.data && typeof payload.data === 'object') {
                applySyncPayload(payload.data);
              }
            }
          } catch(e) {}
        });

        eventSource.addEventListener('patch', (event) => {
          try {
            const payload = JSON.parse(event.data);
            if (payload && payload.data) applySyncPayload(payload.data);
          } catch(e) {}
        });

        eventSource.onerror = () => {};
        eventSource.onopen = () => {};
      } catch(err) {
        console.warn('SSE Error:', err);
      }
    }

    // 7. Mini Spotify Player Widget Logic
    let currentSpotifyUri = "5fnANvKo5Ep7TLEPPjfAzJ"; // Default: Spooky Downtempo Ambience
    let currentSpotifyType = "playlist";

    function parseSpotifyResource(input) {
      if (!input || typeof input !== 'string') return null;
      const clean = input.trim();
      // Match URI: spotify:playlist:xxx or spotify:track:xxx or spotify:album:xxx
      const uriMatch = clean.match(/^spotify:(playlist|track|album):([a-zA-Z0-9]+)/i);
      if (uriMatch) return { type: uriMatch[1].toLowerCase(), id: uriMatch[2] };
      // Match URL: open.spotify.com/(playlist|track|album)/xxx
      const urlMatch = clean.match(/open\.spotify\.com\/(playlist|track|album)\/([a-zA-Z0-9]+)/i);
      if (urlMatch) return { type: urlMatch[1].toLowerCase(), id: urlMatch[2] };
      // Fallback ID if alphanumeric
      if (/^[a-zA-Z0-9]{22}$/.test(clean)) return { type: 'playlist', id: clean };
      return null;
    }

    function setSpotifyPlaylist(resourceInput, displayName) {
      const parsed = parseSpotifyResource(resourceInput);
      if (!parsed) return;
      currentSpotifyType = parsed.type;
      currentSpotifyUri = parsed.id;

      const iframe = document.getElementById('spotifyIframe');
      const trackLabel = document.getElementById('spotifyTrackName');

      if (iframe) {
        iframe.src = `https://open.spotify.com/embed/${parsed.type}/${parsed.id}?utm_source=generator&theme=0`;
      }
      if (trackLabel) {
        trackLabel.textContent = displayName || `Spotify ${parsed.type.toUpperCase()}`;
      }

      try {
        localStorage.setItem('brian_twitch_spotify_id', parsed.id);
        localStorage.setItem('brian_twitch_spotify_type', parsed.type);
        localStorage.setItem('brian_twitch_spotify_name', displayName || `Spotify ${parsed.type}`);
      } catch(e) {}
    }

    function promptCustomSpotify() {
      const res = prompt("Paste your Spotify Playlist, Album, or Track link (e.g. https://open.spotify.com/playlist/...):", "");
      if (res) {
        const parsed = parseSpotifyResource(res);
        if (parsed) {
          const name = prompt("Enter a display name for this playlist/song (optional):", "🎵 My Playlist") || "🎵 My Playlist";
          setSpotifyPlaylist(res, name);
          // Broadcast to shared channel
          try {
            if (typeof BroadcastChannel !== 'undefined') {
              const syncChannel = new BroadcastChannel('brian_theater_sync');
              syncChannel.postMessage({
                type: 'spotify_update',
                payload: { resource: res, name: name }
              });
            }
          } catch(e) {}
        } else {
          alert("Invalid Spotify URL or URI format. Please copy a link directly from Spotify.");
        }
      }
    }

    // Initialize on page load
    window.addEventListener('DOMContentLoaded', () => {
      // 1. Instant hydration from shared stage cache if present
      try {
        const cached = localStorage.getItem('brian_theater_last_stage');
        if (cached) {
          const stageData = JSON.parse(cached);
          if (stageData && stageData.title) {
            applyStageBroadcast({
              title: stageData.title,
              date: stageData.date,
              poster: stageData.poster,
              targetMs: stageData.targetMs
            });
          }
        }
      } catch(e) {}

      // 2. Hydrate Spotify preference if saved
      try {
        const savedId = localStorage.getItem('brian_twitch_spotify_id');
        const savedType = localStorage.getItem('brian_twitch_spotify_type') || 'playlist';
        const savedName = localStorage.getItem('brian_twitch_spotify_name');
        if (savedId) {
          setSpotifyPlaylist(`${savedType}:${savedId}`, savedName || "🎵 Stream Music");
        }
      } catch(e) {}

      renderMovieState();
      setInterval(updateCountdown, 1000);
      initRealtimeSync();
    });
  </script>
</body>
</html>
