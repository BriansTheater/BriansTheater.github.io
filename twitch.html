  <style>
    /* Reset & Viewport containment for 1080p Stream */
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 28%, #160a29 0%, #0b0517 45%, #030207 100%);
      color: #e2e8f0;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Ambient fog drift across bottom */
    @keyframes fogRoll {
      0% { transform: translateX(-12%); opacity: 0.28; }
      50% { transform: translateX(8%); opacity: 0.55; }
      100% { transform: translateX(-12%); opacity: 0.28; }
    }
    .fog-layer {
      animation: fogRoll 20s ease-in-out infinite;
    }

    /* Subtle eerie candle flicker for title and header candle */
    @keyframes eerieCandleFlicker {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(249, 115, 22, 0.45)) drop-shadow(0 0 20px rgba(168, 85, 247, 0.25)); transform: scale(1); }
      30% { filter: drop-shadow(0 0 18px rgba(249, 115, 22, 0.8)) drop-shadow(0 0 35px rgba(168, 85, 247, 0.6)); transform: scale(1.06); }
      60% { filter: drop-shadow(0 0 8px rgba(249, 115, 22, 0.35)) drop-shadow(0 0 14px rgba(168, 85, 247, 0.15)); transform: scale(0.97); }

    .anim-candle { animation: eerieCandleFlicker 3s ease-in-out infinite; }
    .anim-flicker { animation: eerieCandleFlicker 4s ease-in-out infinite; }

    /* Center Ambient Backlight Aura */
    .hero-glow-aura {
      position: absolute;
      inset: -15px;
      background: radial-gradient(ellipse at center, rgba(245, 158, 11, 0.22) 0%, rgba(168, 85, 247, 0.15) 50%, transparent 75%);

      z-index: 0;
      pointer-events: none;

    /* Gothic Proscenium Arch Pillars on the sides */
    .gothic-flank-left {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 140px;
      background: linear-gradient(90deg, rgba(2, 1, 6, 0.95) 0%, rgba(13, 6, 25, 0.75) 50%, transparent 100%);

    }
    .gothic-flank-right {
      position: absolute;
      right: 0;

      box-shadow: inset 15px 0 25px rgba(168, 85, 247, 0.08);

    /* Diagonal Atmospheric Spotlights */
    .spotlight-left {
      position: absolute;
      top: -20px;
      left: 10%;
      width: 320px;
      height: 700px;
      background: linear-gradient(145deg, rgba(168, 85, 247, 0.08) 0%, rgba(245, 158, 11, 0.03) 40%, transparent 70%);

      transform: rotate(18deg);

  </style>
</head>

    <!-- Bottom Real-Time Sync Status indicator -->

        <span>Firebase RTDB Synced</span>

  <!-- ========================================== -->
  <!-- 3. REALTIME JAVASCRIPT LOGIC               -->
  <!-- ========================================== -->
  <script>
    const FIREBASE_RTDB_URL = "https://brianstheater-default-rtdb.firebaseio.com/theaterSync.json";
    let eventSource = null;
    let lastKnownPayload = {};

    // Curated High-Res Movie Artwork Map (Matches main theater stage)
    const verifiedMovieArtworks = {
      "Evil Dead Burn": "https://image.tmdb.org/t/p/w780/5ik4ATKmNtmJU6AYD0bLm56BCVM.jpg",
      "Evil Dead": "https://image.tmdb.org/t/p/w780/5ik4ATKmNtmJU6AYD0bLm56BCVM.jpg",
      "Abraham's Boys A Dracula Story": "https://upload.wikimedia.org/wikipedia/en/6/6c/Abrahams_boys.jpg",
      "Abraham's Boys": "https://upload.wikimedia.org/wikipedia/en/6/6c/Abrahams_boys.jpg",
      "Abrahams Boys": "https://upload.wikimedia.org/wikipedia/en/6/6c/Abrahams_boys.jpg",
      "The Seeding": "https://upload.wikimedia.org/wikipedia/en/f/f4/TheSeedingPoster.jpg",
      "Seeding": "https://upload.wikimedia.org/wikipedia/en/f/f4/TheSeedingPoster.jpg",
      "UnderTone": "https://upload.wikimedia.org/wikipedia/en/6/64/Undertone_%282025%29_poster.jpg",
      "Undertone": "https://upload.wikimedia.org/wikipedia/en/6/64/Undertone_%282025%29_poster.jpg",
      "they will kill you": "https://image.tmdb.org/t/p/w780/6oI4oQKTWMVUlr8Ivqydp28Ruu6.jpg",
      "They Will Kill You": "https://image.tmdb.org/t/p/w780/6oI4oQKTWMVUlr8Ivqydp28Ruu6.jpg",
      "Stephens King: It (1990)": "https://image.tmdb.org/t/p/w780/4ybQ6gopB3H3cu0seVZLznDnIKo.jpg",
      "Stephens King: It (1980)": "https://image.tmdb.org/t/p/w780/4ybQ6gopB3H3cu0seVZLznDnIKo.jpg",
      "Stephens King: It": "https://image.tmdb.org/t/p/w780/4ybQ6gopB3H3cu0seVZLznDnIKo.jpg",
      "Stephen King's It (1990)": "https://image.tmdb.org/t/p/w780/4ybQ6gopB3H3cu0seVZLznDnIKo.jpg",
      "Stephen King's It": "https://image.tmdb.org/t/p/w780/4ybQ6gopB3H3cu0seVZLznDnIKo.jpg",
      "It (1990)": "https://image.tmdb.org/t/p/w780/4ybQ6gopB3H3cu0seVZLznDnIKo.jpg",
      "AHS": "https://image.tmdb.org/t/p/w780/s8Nbz8ok2v3Uw5sRwSC6eWJLX25.jpg",
      "AHS: s13": "https://image.tmdb.org/t/p/w780/s8Nbz8ok2v3Uw5sRwSC6eWJLX25.jpg",
      "AHS: s13e9: the devils is in the Details": "https://image.tmdb.org/t/p/w780/1950DCZIiDljYpDVVgzYDpsWSOE.jpg",
      "AHS: s13e10: The prodigal son": "https://image.tmdb.org/t/p/w780/s8Nbz8ok2v3Uw5sRwSC6eWJLX25.jpg",
      "AHS: s13e11: Madison Happy Ending": "https://image.tmdb.org/t/p/w780/8WSvZ7qd68ykH6ev0RvrBy8vb5b.jpg",
      "AHS: s13e12: Sisters in Arms": "https://image.tmdb.org/t/p/w780/n7ECmVaS5z6B4OEoxgucnZlYmY9.jpg",
      "AHS: s13e13: Devils of a good time": "https://image.tmdb.org/t/p/w780/yCkPLQ10qKIUgRBXmQVVMF1h96d.jpg"
    };

    function getMovieArtworkUrl(title, customMap) {
      if (!title) return '';
      const clean = title.replace(/^🎬\s*/, '').trim();
      if (customMap && customMap[clean]) {
        const v = customMap[clean];
        return (typeof v === 'object') ? (v.backdropUrl || v.posterUrl) : v;
      }
      if (verifiedMovieArtworks[clean]) return verifiedMovieArtworks[clean];
      const lower = clean.toLowerCase();
      for (const [k, v] of Object.entries(verifiedMovieArtworks)) {
        if (k.toLowerCase() === lower) return v;
      }
      return '';
    }

    function isMovieConcluded(item, now = Date.now()) {
      if (!item) return true;
      if (item.status === 'CONCLUDED') return true;
      const end = Number(item.endMs) || 0;
      const start = Number(item.startMs) || 0;
      if (end > 0 && now >= end) return true;
      if (start > 0 && now >= start + (4 * 3600000)) return true;
      return false;
    }

    // Active state model (Initial seed synchronized with main stage)
    let activeMovie = {
      title: "Abraham's Boys A Dracula Story",
      startMs: 1792288800000,
      endMs: 1792294140000,
      posterUrl: "https://upload.wikimedia.org/wikipedia/en/6/6c/Abrahams_boys.jpg",
      showtimeText: "Saturday, Oct 17, 2026 • 7:00 PM PST",
      isNowPlaying: false,
      doorMode: "auto"
    };

    // 1. Digital Countdown Clock Loop
    function updateCountdown() {
      const now = Date.now();
      const diffMs = activeMovie.startMs - now;

      const countdownHeader = document.getElementById('countdownHeaderText');
      const doorsOpenBadge = document.getElementById('doorsOpenBadge');
      const doorsOpenActions = document.getElementById('doorsOpenActions');
      const countdownGrid = document.getElementById('countdownGrid');
      const screeningSubtitle = document.getElementById('screeningStatusBadge');

      const isForcedOpen = (activeMovie.doorMode === 'force_open' || activeMovie.doorMode === 'open');
      const isAutoOpen = (activeMovie.doorMode !== 'force_closed' && diffMs <= 0 && (!activeMovie.endMs || now < activeMovie.endMs));

      if (isForcedOpen || isAutoOpen) {
        // Doors Open / Live Screen state
        if (countdownHeader) countdownHeader.textContent = "THEATER DOORS ARE OPEN!";
        if (doorsOpenBadge) doorsOpenBadge.classList.remove('hidden');
        if (doorsOpenActions) doorsOpenActions.classList.remove('hidden');
        if (countdownGrid) countdownGrid.classList.add('hidden');
        if (screeningSubtitle) {
          screeningSubtitle.textContent = "NOW SCREENING IN THEATER";
          screeningSubtitle.className = "text-[11px] sm:text-xs font-mono font-bold tracking-[0.26em] text-emerald-400 uppercase";
        }
        return;
      }

      // Doors Closed Countdown State
      if (doorsOpenBadge) doorsOpenBadge.classList.add('hidden');
      if (doorsOpenActions) doorsOpenActions.classList.add('hidden');
      if (countdownGrid) countdownGrid.classList.remove('hidden');
      if (screeningSubtitle) {
        screeningSubtitle.textContent = "NEXT SCHEDULED SCREENING";
        screeningSubtitle.className = "text-[11px] sm:text-xs font-mono font-bold tracking-[0.26em] text-purple-300/90 uppercase";
      }
      if (countdownHeader) countdownHeader.textContent = "THEATER DOORS OPEN IN";

      const totalSeconds = Math.max(0, Math.floor(diffMs / 1000));
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const mins = Math.floor((totalSeconds % 3600) / 60);
      const secs = totalSeconds % 60;

      const colDays = document.getElementById('colDays');
      const countDays = document.getElementById('countDays');
      const countHours = document.getElementById('countHours');
      const countMins = document.getElementById('countMins');
      const countSecs = document.getElementById('countSecs');

      if (days > 0) {
        if (colDays) colDays.classList.remove('hidden');
        if (countDays) countDays.textContent = String(days).padStart(2, '0');
        if (countdownGrid) countdownGrid.className = 'grid grid-cols-4 gap-2.5 sm:gap-3.5 w-full font-mono';
      } else {
        if (colDays) colDays.classList.add('hidden');
        if (countdownGrid) countdownGrid.className = 'grid grid-cols-3 gap-2.5 sm:gap-3.5 w-full font-mono';
      }

      if (countHours) countHours.textContent = String(hours).padStart(2, '0');
      if (countMins) countMins.textContent = String(mins).padStart(2, '0');
      if (countSecs) countSecs.textContent = String(secs).padStart(2, '0');
    }

    // 2. Format localized screening time string (Matches main stage exactly)
    function formatShowtime(startMs, dateStr, timeStr) {
      if (startMs) {
        try {
          const d = new Date(startMs);
          const datePart = d.toLocaleDateString('en-US', {
            weekday: 'long',
            month: 'short',
            day: 'numeric',
            year: 'numeric',
            timeZone: 'America/Los_Angeles'
          });
          const timePart = d.toLocaleTimeString('en-US', {
            hour: 'numeric',
            minute: '2-digit',
            timeZone: 'America/Los_Angeles'
          });
          return `${datePart} • ${timePart} PST`;
        } catch(e) {}
      }
      if (dateStr && timeStr) return `${dateStr} • ${timeStr} PST`;
      return dateStr || 'Saturday, Oct 17, 2026 • 7:00 PM PST';
    }

    // 3. Fallback poster image handler
    function handlePosterError(imgEl) {
      if (!imgEl.dataset.failed) {
        imgEl.dataset.failed = "true";
        imgEl.src = "https://image.tmdb.org/t/p/w780/x6rHcQFiYcczLQPrmxXPAicm54E.jpg";
      }
    }

    // 4. Update DOM with active movie state
    function renderMovieState() {
      const titleEl = document.getElementById('movieTitleText');
      const showtimeEl = document.getElementById('movieShowtime');
      const posterEl = document.getElementById('heroPosterImg');

      if (titleEl) titleEl.textContent = (activeMovie.title || 'Coming Soon').replace(/^🎬\s*/, '').trim();
      if (showtimeEl) showtimeEl.textContent = activeMovie.showtimeText;
      if (posterEl && activeMovie.posterUrl) {
        if (posterEl.src !== activeMovie.posterUrl) {
          posterEl.style.opacity = '0.3';
          setTimeout(() => {
            posterEl.src = activeMovie.posterUrl;
            posterEl.onload = () => { posterEl.style.opacity = '1'; };
          }, 150);
        }
      }
      updateCountdown();
    }

    // 5. Parse and apply incoming Firebase Data
    function applySyncPayload(data) {
      if (!data) return;
      Object.assign(lastKnownPayload, data);
      const merged = lastKnownPayload;

      const now = Date.now();
      if (merged.doorMode) activeMovie.doorMode = merged.doorMode;

      let foundNow = null;
      let foundNext = null;

      // 1. Check if cinema.nowPlaying is actively screening right now
      if (merged.cinema && merged.cinema.nowPlaying && merged.cinema.nowPlaying !== 'No Movie Playing') {
        const endMs = Number(merged.cinema.endMs) || 0;
        const startMs = Number(merged.cinema.startMs) || (endMs ? endMs - (105 * 60 * 1000) : 0);
        const isNotConcluded = !isMovieConcluded({ endMs, startMs }, now);
        const isTimeMatch = (endMs > 0 && now < endMs) || (startMs > 0 && now >= startMs && now < startMs + (4 * 3600000));
        const isForcedLive = (merged.doorMode === 'force_open' || merged.doorMode === 'open');

        if (isNotConcluded && (isTimeMatch || isForcedLive)) {
          foundNow = {
            title: merged.cinema.nowPlaying,
            startMs: startMs || (now - 600000),
            endMs: endMs || (now + 3600000),
            posterUrl: merged.cinema.nowPlayingPoster || getMovieArtworkUrl(merged.cinema.nowPlaying, merged.moviePosters)
          };
        }
      }

      // 2. If not actively live, search upcoming schedules sorted by startMs
      const allSchedules = [];
      if (Array.isArray(merged.schedule)) allSchedules.push(...merged.schedule);
      if (Array.isArray(merged.officialSchedule)) allSchedules.push(...merged.officialSchedule);
      if (Array.isArray(merged.cinema && merged.cinema.schedule)) allSchedules.push(...merged.cinema.schedule);

      const upcoming = allSchedules.filter(s => {
        if (!s || !s.title) return false;
        if (isMovieConcluded(s, now)) return false;
        const sEnd = Number(s.endMs) || 0;
        const sStart = Number(s.startMs) || 0;
        return (sEnd > now || sStart > now);
      }).sort((a, b) => (Number(a.startMs) || 0) - (Number(b.startMs) || 0));

      if (upcoming.length > 0) {
        const next = upcoming[0];
        foundNext = {
          title: next.title,
          startMs: Number(next.startMs),
          endMs: Number(next.endMs),
          date: next.date,
          time: next.startTime || next.time,
          posterUrl: next.posterUrl || next.imageUrl || getMovieArtworkUrl(next.title, merged.moviePosters)
        };
      } else if (merged.cinema && merged.cinema.nextTitle && merged.cinema.nextTitle !== 'No Movie Scheduled') {
        const nextStart = Number(merged.cinema.nextStartMs) || 0;
        if (nextStart > now) {
          foundNext = {
            title: merged.cinema.nextTitle,
            startMs: nextStart,
            posterUrl: merged.cinema.nextPoster || getMovieArtworkUrl(merged.cinema.nextTitle, merged.moviePosters)
          };
        }
      }

      const target = foundNow || foundNext;
      if (target) {
        activeMovie.title = target.title.replace(/^🎬\s*/, '').trim();
        if (target.startMs) activeMovie.startMs = target.startMs;
        if (target.endMs) activeMovie.endMs = target.endMs;
        activeMovie.isNowPlaying = Boolean(foundNow);
        activeMovie.showtimeText = formatShowtime(target.startMs, target.date, target.time);

        let resolvedPoster = target.posterUrl || getMovieArtworkUrl(activeMovie.title, merged.moviePosters);
        if (resolvedPoster) activeMovie.posterUrl = resolvedPoster;

        renderMovieState();
      }
    }

    // Apply instantaneous state broadcast from main theater page
    function applyStageBroadcast(payload) {
      if (!payload) return;
      if (payload.title) activeMovie.title = payload.title.replace(/^🎬\s*/, '').trim();
      if (payload.date) activeMovie.showtimeText = payload.date;
      if (payload.poster) activeMovie.posterUrl = payload.poster;
      if (payload.startMs || payload.targetMs) activeMovie.startMs = payload.startMs || payload.targetMs;
      if (payload.doorMode) activeMovie.doorMode = payload.doorMode;
      renderMovieState();
    }

    // 6. Connect to Realtime Firebase SSE Feed & Broadcast Channel
    function initRealtimeSync() {
      const syncStatus = document.getElementById('syncStatus');

      // Shared Broadcast Channel for instant zero-latency cross-tab sync
      try {
        if (typeof BroadcastChannel !== 'undefined') {
          const syncChannel = new BroadcastChannel('brian_theater_sync');
          syncChannel.onmessage = (event) => {
            if (event.data) {
              if (event.data.type === 'stage_update' && event.data.payload) {
                applyStageBroadcast(event.data.payload);
              } else if (event.data.firebasePayload) {
                applySyncPayload(event.data.firebasePayload);
              }
            }
          };
        }
      } catch(e) {}

      // Initial HTTP Snapshot from Firebase RTDB
      fetch(FIREBASE_RTDB_URL)
        .then(res => res.json())
        .then(data => {
          applySyncPayload(data);
          if (syncStatus) {
            syncStatus.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span><span>Firebase RTDB Synced</span>';
          }
        })
        .catch(err => {
          console.warn('Initial Firebase fetch error:', err);
        });

      // Persistent Real-Time SSE Stream
      try {
        if (eventSource) eventSource.close();
        eventSource = new EventSource(FIREBASE_RTDB_URL);

        eventSource.addEventListener('put', (event) => {
          try {
            const payload = JSON.parse(event.data);
            if (payload) {
              if (payload.path === '/' && payload.data) {
                applySyncPayload(payload.data);
              } else if (payload.path === '/cinema' && payload.data) {
                applySyncPayload({ cinema: payload.data });
              } else if (payload.path === '/doorMode' && payload.data) {
                applySyncPayload({ doorMode: payload.data });
              } else if (payload.path === '/schedule' && payload.data) {
                applySyncPayload({ schedule: payload.data });
              } else if (payload.path === '/officialSchedule' && payload.data) {
                applySyncPayload({ officialSchedule: payload.data });
              } else if (payload.path === '/moviePosters' && payload.data) {
                applySyncPayload({ moviePosters: payload.data });
              } else if (payload.data && typeof payload.data === 'object') {
                applySyncPayload(payload.data);
              }
            }
          } catch(e) {}
        });

        eventSource.addEventListener('patch', (event) => {
          try {
            const payload = JSON.parse(event.data);
            if (payload && payload.data) applySyncPayload(payload.data);
          } catch(e) {}
        });

        eventSource.onerror = () => {
          if (syncStatus) {
            syncStatus.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span><span>Reconnecting Sync...</span>';
          }
        };

        eventSource.onopen = () => {
          if (syncStatus) {
            syncStatus.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span><span>Firebase RTDB Synced</span>';
          }
        };
      } catch(err) {
        console.warn('SSE Error:', err);
      }
    }

    // Initialize on page load
    window.addEventListener('DOMContentLoaded', () => {
      // 1. Instant hydration from shared stage cache if present
      try {
        const cached = localStorage.getItem('brian_theater_last_stage');
        if (cached) {
          const stageData = JSON.parse(cached);
          if (stageData && stageData.title) {
            applyStageBroadcast({
              title: stageData.title,
              date: stageData.date,
              poster: stageData.poster,
              targetMs: stageData.targetMs
            });
          }
        }
      } catch(e) {}

      renderMovieState();
      setInterval(updateCountdown, 1000);
      initRealtimeSync();
    });
  </script>
</body>
